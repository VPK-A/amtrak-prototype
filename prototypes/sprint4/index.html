/* Pushed screens inside a sheet: picker screens use the sheet's surface */
.pane--sheet { background: var(--ads-background-surface-default); }
.pane--sheet .ads-navbar { background: var(--ads-background-surface-default); }
.pane--clear { background: var(--ffc-navy); }
.pane--fl { background: var(--ads-background-surface-default); }
.psheet:not(.psheet--clear):not(.psheet--fl) .pane:not(.pane--sheet):not(.pane--gs) { background: var(--ads-background-surface-page); }
/* Push transition */
.navstage { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
.navstage__top, .navstage__under { flex: 1; min-width: 0; min-height: 0; display: flex; }
.navstage__under { position: absolute; inset: 0; pointer-events: none; }
.navstage__top > .pane, .navstage__under > .pane { flex: 1; }
/* Push movement is driven by motion.js (panel token, -25% parallax); CSS only sets layering */
.navstage--fwd .navstage__under { z-index: 0; }
.navstage--fwd .navstage__top { position: relative; z-index: 1; box-shadow: -8px 0 24px rgb(5 18 49 / 0.10); }
.navstage--back .navstage__top { position: relative; z-index: 0; }
.navstage--back .navstage__under { z-index: 1; box-shadow: -8px 0 24px rgb(5 18 49 / 0.10); }
.mo-reduced .navstage__under { display: none; }
.psheet--clear.psheet--pushed { background: var(--ads-background-surface-default); }
.psheet--clear.psheet--pushed .ads-sheet__grabber { background: var(--ads-border-default); }

/* ---------- Motion system (motion.js) ---------- */
/* Selection indicator: one surface moves between options; text and icon state change immediately */
.ads-segmented, .ads-tabbar__tabs, .ads-tabbar-ipad__tabs { position: relative; } /* stable frame for measuring the indicator */
.has-ind { isolation: isolate; }
.has-ind > .mo-ind { position: absolute; z-index: -1; pointer-events: none; }
.ads-segmented.has-ind > button[aria-pressed="true"], .ads-segmented.has-ind > button[aria-selected="true"],
.has-ind > [aria-current="page"] { background: transparent; box-shadow: none; }
.ads-segmented > button, .ads-tabbar__tab, .ads-tabbar-ipad__tab { transition: color var(--mo-control, 200ms) cubic-bezier(.2,0,0,1); }
/* Press feedback (tap token): a small color/elevation change with minimal compression; position never moves */
.ads-btn, .ads-icon-btn, .gs__sum, .gs-chip, .ads-segmented > button { transition-property: background-color, color, box-shadow, transform, filter; transition-duration: 100ms; transition-timing-function: cubic-bezier(.2,0,0,1); }
.ads-btn:not([disabled]):active, .gs-chip:active, .gs__sum:active { transform: scale(0.985); filter: brightness(0.96); }
.ads-icon-btn:not([disabled]):active { filter: brightness(0.92); }
/* Loading keeps the action in place: Cancel sits beside it without pushing the label */
.busyrow .busy-cancel { flex: none; }
/* While a sheet or cover is up, the app behind recedes and can't be hit */
.has-overlay .app { transform-origin: 50% 0; }
.sheet-layer.is-closing, .sheet-layer.is-closing * { pointer-events: none !important; }
.mo-ghost { pointer-events: none; }
/* Reduced motion: no scale or blur, no press compression */
.mo-reduced .app { filter: none !important; transform: none !important; }
.mo-reduced .ads-btn:active, .mo-reduced .gs-chip:active, .mo-reduced .gs__sum:active { transform: none; }
@media (prefers-reduced-motion: reduce) { .ads-btn:active, .gs-chip:active, .gs__sum:active { transform: none; } }

/* ---------- Supporting-information sheet (interact.js) ----------
   Rises over the current task: rounded top corners, content height up to most of the screen, scrolls inside.
   The task stays visible behind the scrim and is inert. */
.info-layer { position: absolute; inset: 0; z-index: 16; }
.info-scrim { position: absolute; inset: 0; background: var(--ads-background-surface-scrim); }
.info-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 96px); display: flex; flex-direction: column; border-radius: 16px 16px 0 0; background: var(--ads-background-surface-default); box-shadow: var(--ads-shadow-elevation-xl); overflow: hidden; }

.info-head { flex: none; display: grid; grid-template-columns: minmax(64px, 1fr) auto minmax(64px, 1fr); align-items: center; gap: 8px; min-height: 52px; padding: 4px 12px; border-bottom: 1px solid var(--ads-border-subtle); }

.info-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 20px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; color: var(--ads-content-text-primary); font-size: var(--ads-type-body-size, 16px); line-height: 1.45; }

.info-art { display: grid; place-items: center; height: 120px; margin: -16px -20px 4px; background: var(--ads-background-surface-sunken); color: var(--ads-content-icon-brand, var(--ads-content-icon-primary)); }

.fam-card__title { margin: 0; padding: 12px 14px 10px; font-size: 16px; font-weight: 600; color: var(--ads-content-text-primary); background: var(--ads-background-surface-sunken); }

/* One backdrop at a time: when another layer opens above, the layer below hides its own scrim and the top
   layer dims everything once (no doubled or tripled darkening) */
.sheet-layer:has(~ .cover-layer, ~ .info-layer, ~ .dialog-layer) > .sheet-scrim { opacity: 0 !important; }
.cover-layer:has(~ .info-layer, ~ .dialog-layer) { background: transparent; }
.info-layer:has(~ .dialog-layer) > .info-scrim { opacity: 0 !important; }

.ov-travs { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.ov-travs__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

  // Inside the Travelers sheet: each traveler, with discount, assistance and companion edited on their own
  return `<section class="ov-travs" aria-labelledby="ov-tr-h"><h4 class="ffc-h" id="ov-tr-h">Traveler details</h4><ul class="ov-list">${rows}</ul></section>`;
}
// Pass Rider eligibility at a glance (NMA-623, 1016–1018; dependent age NMA-1017 AC4)
function overviewPassRider(b) {
  const d = D(), p = d.passrider; if (intentOf(b) !== 'pr' || !p) return '';
  const can = prCanStart(d), rows = [['Booking as', `${prRoleLabel(d)} on pass ${d.employee ? d.employee.pass.slice(0, 3) + '••••' + d.employee.pass.slice(-2) : ''}`], ['Travel type', b.prType === 'business' ? 'Business' : b.prType === 'leisure' ? 'Leisure' : 'Not chosen yet']];
  if (p.role === 'employee') rows.push(['Companion passes', `${p.compLeft} of 16 left this year`]);
  return `<section class="ov-pr" aria-label="Pass Rider eligibility"><p class="ov-pr__title">${ic(can.ok ? 'check-circle' : 'alert-diamond', 'ads-icon--sm')}Pass Rider ${can.ok ? 'eligible' : 'not available'}</p><dl class="cpn-dl">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${can.ok ? '' : `<p class="ads-helper">${esc(can.text)}</p>`}</section>`;
}

// ---------- Editing one traveler from the overview ----------
const TRAV_SNAP = b => clone({ prKinds: b.prKinds || {}, tdisc: b.tdisc, disc: b.disc, assist: b.assist, assistDone: b.assistDone, assistFromProfile: b.assistFromProfile, ta: b.ta || {}, assistOn: b.assistOn });
A['ov-traveler'] = (t, ri) => {
  const b = D().booking; push('traveler', { t: t.dataset.t }, +ri);
  const r = sheet().stack[sheet().stack.length - 1]; r.u.snap = TRAV_SNAP(b);
};
SCR.traveler = (r, ri) => {
  const d = D(), b = d.booking, t = travelerList(b).find(x => x.key === r.p.t);
  if (!t) return { title: 'Traveler', kind: 'push', body: '<p class="ads-body-small">This traveler is no longer on the booking.</p>' };
  const fromProfile = d.signedIn && ['military', 'rpa'].includes(d.discount.type) && b.disc === d.discount.type, err = travelerError(b, t);
  const body = `<div class="ffc-sheethead"><h3 class="ffc-sheettitle" tabindex="-1" data-title>${esc(t.label)}</h3><p class="ffc-sheetsub">Changes show in the overview right away. Cancel puts them back.</p></div><div class="fam-card ov-edit${err ? ' has-error' : ''}">${discountRow(b, t, fromProfile)}${assistanceRow(b, t)}${companionRow(b, t)}${err ? `<p class="ads-helper ads-helper--error" role="alert">${ic('alert-diamond')}<span>${esc(err)}</span></p>` : ''}</div>`;
  return { title: t.label, srTitle: true, cls: 'pane--sheet', kind: 'editor', cancelA: 'sheet-cancel', close: true, banner: false, body, foot: `<button class="ads-btn ads-btn--block" type="button" data-a="sheet-done">Done</button>` };
};
// Cancel puts back what this sheet changed; Done keeps it (the booking was already updated live)
A['sheet-cancel'] = (t, ri) => {
  const r = routeAt(ri), b = D().booking;
  if (r && r.u.snap) Object.assign(b, clone(r.u.snap));
  popTo(+ri - 1);
};
A['sheet-done'] = (t, ri) => popTo(+ri - 1);

// Steps with Cancel (Overview traveler sheet, Familiar Traveler selection): Escape and X don't keep their
// unconfirmed edits either. Escape cancels the step; X puts the step back, then closes the booking.
function cancelActionFor(r) { return !r ? null : r.s === 'traveler' ? 'sheet-cancel' : r.s === 'travelers' && v1() ? 'trav-cancel' : null; }
const closeBeforeCancel = A.close;
A.close = A.scrim = (t, ri) => {
  const sh = sheet(), top = sh && sh.stack[sh.stack.length - 1];
  if (top && cancelActionFor(top) && top.u.snap && !(top.s === 'travelers' && paxProblems(D().booking.pax).length)) Object.assign(D().booking, clone(top.u.snap));
  return closeBeforeCancel(t, ri);
};

/* Sprint 4 prototype: Version 4 (Compact). Dense, but nothing required is hidden:
   - the travelers row carries one small tag per traveler with their discount, assistance and companion
     pairing; a tag opens that traveler's short edit sheet (shared with Overview);
   - the assistance row keeps Add and Remove for the whole booking and gives every traveler one line with
     their own Add, Edit or Remove;
   - when offline, a first-time questionnaire can't open (NMA-973); the row says so in one line with Try again. */

const DISC_TAG = { pwd: 'PWD', companion: 'Companion', military: 'Military', rpa: 'RPA', senior: 'Senior', childfare: 'Child fare', infant: 'Lap infant', infantchild: 'Child fare', none: '' };
const tShort = t => `T${t.n}`;
function flTravelerTags(b) {
  const list = travelerList(b), std = ['standard', 'personal'].includes(intentOf(b));
  if (!list.length) return '';
  const tags = list.map(t => {
    const a = assistRec(b, t.key), c = assistCat(b, t.key), x = std ? tdiscOf(b, t) : null, err = travelerError(b, t);
    const parts = [], say = [];
    if (x && DISC_TAG[x]) { parts.push(`<span class="fl-tv__disc">${DISC_TAG[x]}</span>`); say.push(`${TDISC_LABEL[x]} discount`); }
    if (c && c !== 'none') { parts.push(`<span class="fl-tv__as">${ic('assistance', 'ads-icon--sm')}</span>`); say.push(`assistance: ${c === 'companion' ? 'personal companion' : CATS[c]}`); }
    else say.push('no assistance');
    if (c === 'companion') { const f = travelerList(b).find(z => z.key === a.m.for); parts.push(`<span class="fl-tv__pair">↔ ${f ? tShort(f) : '?'}</span>`); say.push(`personal companion to ${f ? f.label : 'no one'}`); }
    if (c === 'disability') { const comp = companionOf(b, t.key); if (comp) { parts.push(`<span class="fl-tv__pair">↔ ${tShort(comp)}</span>`); say.push(`personal companion: ${comp.label}`); } }
    return `<li><button class="fl-tv${err ? ' is-error' : ''}" type="button" data-a="ov-traveler" data-t="${t.key}" aria-label="${esc(t.label)}: ${esc(say.join(', '))}${err ? '. Needs a change' : ''}. Edit"><b>${tShort(t)}</b><span class="fl-tv__type">${esc(t.short.replace(/^You · /, 'You, '))}</span>${parts.join('')}${err ? ic('alert-diamond', 'ads-icon--sm fl-tv__err') : ''}</button></li>`;
  }).join('');
  return `<ul class="fl-tvs" aria-label="Travelers, tap to edit one">${tags}</ul>`;
}
// One line per traveler, with their own Add, Edit or Remove
function flAssistLines(b) {
  const lines = travelerList(b).map(t => {
    const a = assistRec(b, t.key), on = a.done, c = on ? a.m.cat : null, items = on ? assistSummaryItems(a.m) : [], err = travelerError(b, t);
    const what = !on ? 'None' : c === 'none' ? 'No help needed' : c === 'companion' ? `Personal companion to ${tShort(travelerList(b).find(z => z.key === a.m.for) || { n: '?' })}` : items[0];
    const more = on && c !== 'companion' ? items.slice(1).filter(x => x !== 'No other needs').join(' · ') : '';
    const acts = on ? flAct('assist-edit', 'Edit', `Edit assistance for ${t.label}`, `data-t="${t.key}"`) + flAct('assist-remove', 'Remove', `Remove assistance for ${t.label}`, `data-t="${t.key}"`) : flAct('assist-edit', 'Add', `Add assistance for ${t.label}`, `data-t="${t.key}"`);
    return `<li class="fl-al${err ? ' is-error' : ''}"><span class="fl-al__who">${tShort(t)} ${esc(t.short)}</span><span class="fl-al__what">${esc(what)}${more ? `<small>${esc(more)}</small>` : ''}${err ? `<small class="fl-al__err">${ic('alert-diamond', 'ads-icon--sm')}${esc(err)}</small>` : ''}</span><span class="fl-al__acts">${acts}</span></li>`;
  }).join('');
  const prob = assistProblems(b);
  return `<div class="fl-assistlist">${prob.length ? `<p class="ads-helper ads-helper--error" id="atl-err" tabindex="-1">${ic('alert-diamond')}<span>Assistance needs a change. See the marked traveler.</span></p>` : ''}<ul class="fl-als" aria-label="Assistance by traveler">${lines}</ul></div>`;
}
// One-line offline explanation with a way forward
function flOfflineNote(b) {
  if (!b.assistOffline) return '';
  const t = travelerList(b).find(z => z.key === b.assistOffline) || { label: 'this traveler', key: b.assistOffline };
  return `<p class="fl-offline" id="fl-offline-note" role="status" tabindex="-1">${ic('alert-triangle', 'ads-icon--sm')}<span>Offline. ${esc(t.label)}’s questions need a connection the first time. Assistance stays on.</span>${flAct('assist-edit', 'Try again', `Try again: assistance for ${t.label}`, `data-t="${t.key}"`)}${flAct('assist-offline-ok', 'OK', 'Dismiss')}</p>`;
}
INFO.assistance = {
  title: 'Assistance',
  body: () => `<p>Tell us your travel needs, like a mobility device, a service animal, hearing loss or station assistance. Answer for each traveler who needs help; the others can stay without answers.</p><p>One traveler with a disability may bring one personal companion, who gets the Companion discount.</p><p>Answering the questions for the first time needs a connection. After that you can finish or review them offline. Finding trains needs a connection.</p><p class="info-draft">Final explanation text comes from AEM.</p>`
};

/* Sprint 4 prototype shell (not part of the app): a compact controller beside the device, collapsed by default
   and opened from a floating button. Opening or closing it never touches the demo state. */
function setChrome(open, moveFocus = true) {
  const btn = $('#chromeToggle'), label = open ? 'Hide prototype controls' : 'Show prototype controls';
  document.body.classList.toggle('chrome-hidden', !open);
  $('#protoCtl').hidden = !open;
  btn.setAttribute('aria-expanded', String(open)); btn.setAttribute('aria-label', label); btn.title = label;
  scaleDevice();
  if (moveFocus) (open ? $('#ctlTitle') : btn).focus();
}
$('#chromeToggle').addEventListener('click', () => setChrome(document.body.classList.contains('chrome-hidden')));
// Escape closes it, unless the key belongs to the app inside the device (sheets, dialogs)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented || document.body.classList.contains('chrome-hidden')) return;
  if ($('#device').contains(e.target)) return;
  setChrome(false);
});
setChrome(false, false);
// The device is a phone or tablet app, where nothing hovers: drop every hover style except the prototype's
// own controls outside the device (toolbar, view switch, launcher). Press and focus states stay.
(function dropAppHover() {
  const keep = /\.ctl\b|chrome-/;
  const walk = list => {
    for (let i = list.length - 1; i >= 0; i--) {
      const r = list[i];
      if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
      if (!r.selectorText || !r.selectorText.includes(':hover')) continue;
      const parts = r.selectorText.split(/,(?![^(]*\))/).map(x => x.trim()).filter(x => !x.includes(':hover') || keep.test(x));
      if (!parts.length) (r.parentRule || r.parentStyleSheet).deleteRule(i);
      else if (parts.join(', ') !== r.selectorText) r.selectorText = parts.join(', ');
    }
  };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch (e) {} }
})();

// Sentence case everywhere: no labels forced into capitals by CSS (prototype only; the ADS files are untouched)
(function noForcedCaps() {
  const walk = list => { for (const r of list) { if (r.cssRules && !r.style) { walk(r.cssRules); continue; } const st = r.style; if (!st) continue; if (/uppercase|capitalize/.test(st.textTransform)) { st.textTransform = 'none'; if (st.letterSpacing) st.letterSpacing = '0'; } } };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch (e) {} }
})();

{ const v = store.get('s4-v'); if (['1', '3'].includes(v)) TB.v = +v; /* only reviewed concepts are restored */ const d = store.get('s4-dev'); if (d === 'iphone' || d === 'ipad') TB.dev = d; }
