/* Sprint 4 prototype: Google Maps surface for the station selector's Map view (NMA-1084).
   - Only the map surface changes. The screen, its List / Map tabs, the ADS zoom and locate controls, the floating
     station card, Details and Select, and every selection rule stay in stationmap.js.
   - Station IDs, names and coordinates come from the prototype's station data (STATIONS, STATION_GEO); stations
     with missing or invalid coordinates are left off the map and stay available in search and the list.
   - Selection state stays where it was: r.u.map (centre and zoom) and r.u.mapSel (the highlighted station). Tapping
     a marker runs the existing map-pin action (highlight and card); only Select or a list row writes the field.
     Panning and zooming update the view only.
   - Configuration: window.S4_CONFIG.googleMapsApiKey (and optional googleMapsMapId). `npm run dev` fills it from
     VITE_GOOGLE_MAPS_API_KEY in .env.local (not committed). The standalone index.html never contains a key.
   - Fallback: without a key, or if Google Maps fails to load or rejects the key, the existing placeholder map is
     used, with the same markers, gestures and selection path. See GOOGLE-MAPS.md. */

const GMAP_CFG = () => Object.assign({ googleMapsApiKey: '', googleMapsMapId: '' }, window.S4_CONFIG || {});
// state: off (not requested) · loading · ready · failed (reason: no-key, network, auth, timeout, import)
const GM = { state: 'off', reason: '', lib: null, map: null, host: null, markers: [], applied: null, warned: false };
const GM_TIMEOUT_MS = 15000;
const gmActive = () => GM.state === 'ready' && loc().map !== 'fail';

function gmLoad() {
  if (GM.state !== 'off') return;
  const cfg = GMAP_CFG();
  if (!cfg.googleMapsApiKey) { GM.state = 'failed'; GM.reason = 'no-key'; return; }
  GM.state = 'loading';
  const ready = async () => {
    try {
      const { Map } = await google.maps.importLibrary('maps');
      const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
      if (GM.state !== 'loading') return;
      clearTimeout(GM.timer); GM.lib = { Map, AdvancedMarkerElement }; GM.state = 'ready';
      track('map_load_succeeded', { provider: 'google' }); render();
    } catch (e) { gmFail('import'); }
  };
  // Google calls gm_authFailure when the key is invalid, restricted or not enabled for the Maps JavaScript API
  window.gm_authFailure = () => gmFail('auth');
  GM.timer = setTimeout(() => { if (GM.state === 'loading') gmFail('timeout'); }, GM_TIMEOUT_MS);
  if (window.google && google.maps && google.maps.importLibrary) { ready(); return; } // already loaded (or a test double)
  window.__s4GmapsReady = ready;
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cfg.googleMapsApiKey)}&v=weekly&loading=async&libraries=marker&callback=__s4GmapsReady`;
  s.async = true; s.onerror = () => gmFail('network');
  document.head.appendChild(s);
}
function gmFail(why) {
  if (GM.state === 'failed') return;
  clearTimeout(GM.timer); GM.state = 'failed'; GM.reason = why;
  gmClear(); GM.map = null; GM.host = null; GM.applied = null;
  track('map_load_failed', { provider: 'google', reason: why });
  render(); // the placeholder map takes over with the same view and selection
}
function gmNotes() {
  const bad = geoIssues();
  if (bad.length) { snote(`Not on the map (missing or invalid coordinates): ${bad.join(', ')}. They stay available in search and the list.`); if (!GM.warned) { GM.warned = true; console.warn('[station map] stations without valid coordinates:', bad.join(', ')); } }
  if (GM.state === 'ready') snote('Map: Google Maps JavaScript API. Markers come from the prototype’s station data for the visible area.');
  else if (GM.state === 'loading') snote('Map: loading Google Maps; the placeholder map is shown until it’s ready.');
  else snote(`Map: placeholder drawing (Google Maps ${GM.reason === 'no-key' ? 'has no API key configured' : `didn’t load: ${GM.reason}`}). Markers, gestures and selection work the same. See GOOGLE-MAPS.md.`);
}

// ---------- The surface: one Google map that survives the prototype's re-renders ----------
function gmEnsure(r) {
  if (GM.map) return;
  const m = r.u.map, cfg = GMAP_CFG();
  GM.host = document.createElement('div'); GM.host.className = 'gmap-host';
  GM.map = new GM.lib.Map(GM.host, {
    center: { lat: m.lat, lng: m.lon }, zoom: m.z, mapId: cfg.googleMapsMapId || 'DEMO_MAP_ID',
    disableDefaultUI: true, clickableIcons: false, keyboardShortcuts: false, gestureHandling: 'greedy',
    isFractionalZoomEnabled: false, minZoom: Z_MIN, maxZoom: Z_MAX
  });
  GM.applied = { lat: m.lat, lon: m.lon, z: m.z };
  // A pan or zoom by the person changes the view only: never the highlighted station or the booking
  GM.map.addListener('idle', () => {
    const r2 = selRoute(); if (!r2 || !r2.u.map || r2.u.view !== 'map') return;
    const c = GM.map.getCenter(), z = GM.map.getZoom(), lat = c.lat(), lon = c.lng(), a = GM.applied;
    if (a && Math.abs(a.lat - lat) < 1e-7 && Math.abs(a.lon - lon) < 1e-7 && a.z === z) return;
    const m2 = r2.u.map, zoomed = z !== m2.z;
    Object.assign(m2, { lat, lon, z, why: 'moved' }); GM.applied = { lat, lon, z };
    track(zoomed ? 'map_zoomed' : 'map_panned', { via: zoomed ? 'pinch_or_wheel' : 'drag', zoom: z, provider: 'google' });
    pendingFocus = null; render();
  });
}
function gmClear() { GM.markers.forEach(mk => { mk.map = null; }); GM.markers = []; }
// Apply the selector's state to the map: camera (when the app moved it), markers and the highlighted station
function gmSync(r) {
  const m = r.u.map, a = GM.applied;
  if (!a || Math.abs(a.lat - m.lat) > 1e-7 || Math.abs(a.lon - m.lon) > 1e-7 || a.z !== m.z) {
    GM.applied = { lat: m.lat, lon: m.lon, z: m.z };
    GM.map.setCenter({ lat: m.lat, lng: m.lon }); GM.map.setZoom(m.z);
  }
  gmClear();
  const pos = locKnown() ? devicePos() : null, put = (lat, lon, html, z) => {
    const el = document.createElement('div'); el.className = 'gmap-marker'; el.innerHTML = html;
    GM.markers.push(new GM.lib.AdvancedMarkerElement({ map: GM.map, position: { lat, lng: lon }, content: el, zIndex: z }));
  };
  for (const g of visibleMarkers(m)) {
    const lat = g.items.reduce((s, p) => s + geoOf(p.s.code).lat, 0) / g.items.length, lon = g.items.reduce((s, p) => s + geoOf(p.s.code).lon, 0) / g.items.length;
    put(lat, lon, markerHtml(g, r.u.mapSel, pos, false), g.items.some(p => p.s.code === r.u.mapSel) ? 3 : 1);
  }
  if (pos) put(pos.lat, pos.lon, `<div class="map-me${pos.approx ? ' map-me--approx' : ''}" style="--acc:${pos.approx ? 60 : 14}px" role="img" aria-label="Your location${pos.approx ? ', approximate' : ''}"></div>`, 2);
}
// After every render: put the persistent map back into the Map view's slot, then sync it
const renderBeforeGmap = render;
render = function () {
  const out = renderBeforeGmap.apply(this, arguments);
  const slot = document.querySelector('#device .gmap-slot'), r = selRoute();
  if (slot && GM.state === 'ready' && r && r.u.map) { gmEnsure(r); if (GM.host.parentNode !== slot) slot.appendChild(GM.host); gmSync(r); }
  else if (!slot && GM.markers.length) gmClear(); // the Map view closed: markers go; the map keeps its camera for reopening
  return out;
};

/* Sprint 4 prototype: settled design decisions. The design-team comparison settings (Traveler assistance layout,
   Pass Rider Business Pass controls, Pass Rider traveler selection, Station selector) were retired; the

const assistAbove = () => false;
const assistIntro = () => '';
const bpCompact = () => false;

/* Sprint 4 prototype: Version 4 (Compact). Dense, but nothing required is hidden:
   - the travelers row carries one small tag per traveler with their discount, assistance and companion
     pairing; a tag opens that traveler's short edit sheet (shared with Overview);
   - the assistance row keeps Add and Remove for the whole booking and gives every traveler one line with
     their own Add, Edit or Remove;
   - when offline, a first-time questionnaire can't open (NMA-973); the row says so in one line with Try again. */

const DISC_TAG = { pwd: 'PWD', companion: 'Companion', military: 'Military', rpa: 'RPA', senior: 'Senior', childfare: 'Child fare', infant: 'Lap infant', infantchild: 'Child fare', none: '' };
const tShort = t => `T${t.n}`;
function flTravelerTags(b) {
  const list = travelerList(b), std = ['standard', 'personal'].includes(intentOf(b));
  if (!list.length) return '';
  const tags = list.map(t => {
    const a = assistRec(b, t.key), c = assistCat(b, t.key), x = std ? tdiscOf(b, t) : null, err = travelerError(b, t);
    const parts = [], say = [];
    if (x && DISC_TAG[x]) { parts.push(`<span class="fl-tv__disc">${DISC_TAG[x]}</span>`); say.push(`${TDISC_LABEL[x]} discount`); }
    if (c && c !== 'none') { parts.push(`<span class="fl-tv__as">${ic('assistance', 'ads-icon--sm')}</span>`); say.push(`assistance: ${c === 'companion' ? 'personal companion' : CATS[c]}`); }
    else say.push('no assistance');
    if (c === 'companion') { const f = travelerList(b).find(z => z.key === a.m.for); parts.push(`<span class="fl-tv__pair">↔ ${f ? tShort(f) : '?'}</span>`); say.push(`personal companion to ${f ? f.label : 'no one'}`); }
    if (c === 'disability') { const comp = companionOf(b, t.key); if (comp) { parts.push(`<span class="fl-tv__pair">↔ ${tShort(comp)}</span>`); say.push(`personal companion: ${comp.label}`); } }
    return `<li><button class="fl-tv${err ? ' is-error' : ''}" type="button" data-a="ov-traveler" data-t="${t.key}" aria-label="${esc(t.label)}: ${esc(say.join(', '))}${err ? '. Needs a change' : ''}. Edit"><b>${tShort(t)}</b><span class="fl-tv__type">${esc(t.short.replace(/^You · /, 'You, '))}</span>${parts.join('')}${err ? ic('alert-diamond', 'ads-icon--sm fl-tv__err') : ''}</button></li>`;
  }).join('');
  return `<ul class="fl-tvs" aria-label="Travelers, tap to edit one">${tags}</ul>`;
}
// One line per traveler, with their own Add, Edit or Remove
function flAssistLines(b) {
  const lines = travelerList(b).map(t => {
    const a = assistRec(b, t.key), on = a.done, c = on ? a.m.cat : null, items = on ? assistSummaryItems(a.m) : [], err = travelerError(b, t);
    const what = !on ? 'None' : c === 'none' ? 'No help needed' : c === 'companion' ? `Personal companion to ${tShort(travelerList(b).find(z => z.key === a.m.for) || { n: '?' })}` : items[0];
    const more = on && c !== 'companion' ? items.slice(1).filter(x => x !== 'No other needs').join(' · ') : '';
    const acts = on ? flAct('assist-edit', 'Edit', `Edit assistance for ${t.label}`, `data-t="${t.key}"`) + flAct('assist-remove', 'Remove', `Remove assistance for ${t.label}`, `data-t="${t.key}"`) : flAct('assist-edit', 'Add', `Add assistance for ${t.label}`, `data-t="${t.key}"`);
    return `<li class="fl-al${err ? ' is-error' : ''}"><span class="fl-al__who">${tShort(t)} ${esc(t.short)}</span><span class="fl-al__what">${esc(what)}${more ? `<small>${esc(more)}</small>` : ''}${err ? `<small class="fl-al__err">${ic('alert-diamond', 'ads-icon--sm')}${esc(err)}</small>` : ''}</span><span class="fl-al__acts">${acts}</span></li>`;
  }).join('');
  const prob = assistProblems(b);
  return `<div class="fl-assistlist">${prob.length ? `<p class="ads-helper ads-helper--error" id="atl-err" tabindex="-1">${ic('alert-diamond')}<span>Assistance needs a change. See the marked traveler.</span></p>` : ''}<ul class="fl-als" aria-label="Assistance by traveler">${lines}</ul></div>`;
}
// One-line offline explanation with a way forward
function flOfflineNote(b) {
  if (!b.assistOffline) return '';
  const t = travelerList(b).find(z => z.key === b.assistOffline) || { label: 'this traveler', key: b.assistOffline };
  return `<p class="fl-offline" id="fl-offline-note" role="status" tabindex="-1">${ic('alert-triangle', 'ads-icon--sm')}<span>Offline. ${esc(t.label)}’s questions need a connection the first time. Assistance stays on.</span>${flAct('assist-edit', 'Try again', `Try again: assistance for ${t.label}`, `data-t="${t.key}"`)}${flAct('assist-offline-ok', 'OK', 'Dismiss')}</p>`;
}
INFO.assistance = {
  title: 'Assistance',
  body: () => `<p>Tell us your travel needs, like a mobility device, a service animal, hearing loss or station assistance. Answer for each traveler who needs help; the others can stay without answers.</p><p>One traveler with a disability may bring one personal companion, who gets the Companion discount.</p><p>Answering the questions for the first time needs a connection. After that you can finish or review them offline. Finding trains needs a connection.</p><p class="info-draft">Final explanation text comes from AEM.</p>`
};

/* Sprint 4 prototype shell (not part of the app): a compact controller beside the device, collapsed by default
   and opened from a floating button. Opening or closing it never touches the demo state. */
function setChrome(open, moveFocus = true) {
  const btn = $('#chromeToggle'), label = open ? 'Hide prototype controls' : 'Show prototype controls';
  document.body.classList.toggle('chrome-hidden', !open);
  $('#protoCtl').hidden = !open;
  btn.setAttribute('aria-expanded', String(open)); btn.setAttribute('aria-label', label); btn.title = label;
  scaleDevice();
  if (moveFocus) (open ? $('#ctlTitle') : btn).focus();
}
$('#chromeToggle').addEventListener('click', () => setChrome(document.body.classList.contains('chrome-hidden')));
// Escape closes it, unless the key belongs to the app inside the device (sheets, dialogs)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented || document.body.classList.contains('chrome-hidden')) return;
  if ($('#device').contains(e.target)) return;
  setChrome(false);
});
setChrome(false, false);
// The device is a phone or tablet app, where nothing hovers: drop every hover style except the prototype's
// own controls outside the device (toolbar, view switch, launcher). Press and focus states stay.
(function dropAppHover() {
  const keep = /\.ctl\b|chrome-/;
  const walk = list => {
    for (let i = list.length - 1; i >= 0; i--) {
      const r = list[i];
      if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
      if (!r.selectorText || !r.selectorText.includes(':hover')) continue;
      const parts = r.selectorText.split(/,(?![^(]*\))/).map(x => x.trim()).filter(x => !x.includes(':hover') || keep.test(x));
      if (!parts.length) (r.parentRule || r.parentStyleSheet).deleteRule(i);
      else if (parts.join(', ') !== r.selectorText) r.selectorText = parts.join(', ');
    }
  };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch (e) {} }
})();

// Sentence case everywhere: no labels forced into capitals by CSS (prototype only; the ADS files are untouched)
(function noForcedCaps() {
  const walk = list => { for (const r of list) { if (r.cssRules && !r.style) { walk(r.cssRules); continue; } const st = r.style; if (!st) continue; if (/uppercase|capitalize/.test(st.textTransform)) { st.textTransform = 'none'; if (st.letterSpacing) st.letterSpacing = '0'; } } };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch (e) {} }
})();
