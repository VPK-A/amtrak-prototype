   Needs css/tokens.css (and css/icons.css for the glyphs). Class prefix: ads- */

/* ---------- Base ---------- */
.ads-root, .ads-root * { box-sizing: border-box; }
.ads-root {
  font-family: var(--ads-font-family);
  font-size: var(--ads-type-body-size);
  line-height: var(--ads-type-body-line-height);
  color: var(--ads-content-text-primary);
  background: var(--ads-background-surface-page);
  -webkit-font-smoothing: antialiased;
}
.ads-focusable:focus-visible,
.ads-root :is(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: var(--ads-focus-ring-width) solid var(--ads-border-focus);
  outline-offset: var(--ads-focus-ring-offset);
}
[hidden] { display: none !important; }
.ads-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { .ads-root * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ---------- Typography (Figma text styles) ---------- */
.ads-text { margin: 0; font-family: var(--ads-font-family); }
.ads-display, .ads-h1, .ads-h2, .ads-h3, .ads-h4, .ads-body, .ads-body-emphasis, .ads-body-small,
.ads-body-small-emphasis, .ads-field-label, .ads-button-text, .ads-button-small-text, .ads-overline, .ads-caption { margin: 0; font-family: var(--ads-font-family); }
.ads-display  { font-size: var(--ads-type-display-size);  line-height: var(--ads-type-display-line-height);  letter-spacing: var(--ads-type-display-letter-spacing);  font-weight: var(--ads-type-display-weight); }
.ads-h1       { font-size: var(--ads-type-h1-headline-size); line-height: var(--ads-type-h1-headline-line-height); letter-spacing: var(--ads-type-h1-headline-letter-spacing); font-weight: var(--ads-type-h1-headline-weight); }
.ads-h2       { font-size: var(--ads-type-h2-headline-size); line-height: var(--ads-type-h2-headline-line-height); letter-spacing: var(--ads-type-h2-headline-letter-spacing); font-weight: var(--ads-type-h2-headline-weight); }
.ads-h3       { font-size: var(--ads-type-h3-headline-size); line-height: var(--ads-type-h3-headline-line-height); letter-spacing: var(--ads-type-h3-headline-letter-spacing); font-weight: var(--ads-type-h3-headline-weight); }
.ads-h4       { font-size: var(--ads-type-h4-headline-size); line-height: var(--ads-type-h4-headline-line-height); letter-spacing: var(--ads-type-h4-headline-letter-spacing); font-weight: var(--ads-type-h4-headline-weight); }
.ads-body     { font-size: var(--ads-type-body-size); line-height: var(--ads-type-body-line-height); letter-spacing: var(--ads-type-body-letter-spacing); font-weight: var(--ads-type-body-weight); }
.ads-body-emphasis { font-size: var(--ads-type-body-emphasis-size); line-height: var(--ads-type-body-emphasis-line-height); letter-spacing: var(--ads-type-body-emphasis-letter-spacing); font-weight: var(--ads-type-body-emphasis-weight); }
.ads-body-small { font-size: var(--ads-type-body-small-size); line-height: var(--ads-type-body-small-line-height); letter-spacing: var(--ads-type-body-small-letter-spacing); font-weight: var(--ads-type-body-small-weight); }
.ads-body-small-emphasis { font-size: var(--ads-type-body-small-emphasis-size); line-height: var(--ads-type-body-small-emphasis-line-height); letter-spacing: var(--ads-type-body-small-emphasis-letter-spacing); font-weight: var(--ads-type-body-small-emphasis-weight); }
.ads-field-label { font-size: var(--ads-type-field-label-size); line-height: var(--ads-type-field-label-line-height); letter-spacing: var(--ads-type-field-label-letter-spacing); font-weight: var(--ads-type-field-label-weight); }
.ads-button-text { font-size: var(--ads-type-button-size); line-height: var(--ads-type-button-line-height); letter-spacing: var(--ads-type-button-letter-spacing); font-weight: var(--ads-type-button-weight); }
.ads-button-small-text { font-size: var(--ads-type-button-small-size); line-height: var(--ads-type-button-small-line-height); letter-spacing: var(--ads-type-button-small-letter-spacing); font-weight: var(--ads-type-button-small-weight); }
.ads-overline { font-size: var(--ads-type-overline-size); line-height: var(--ads-type-overline-line-height); letter-spacing: var(--ads-type-overline-letter-spacing); font-weight: var(--ads-type-overline-weight); text-transform: uppercase; }
.ads-caption  { font-size: var(--ads-type-caption-size); line-height: var(--ads-type-caption-line-height); letter-spacing: var(--ads-type-caption-letter-spacing); font-weight: var(--ads-type-caption-weight); }
.ads-text-secondary { color: var(--ads-content-text-secondary); }
.ads-text-tertiary  { color: var(--ads-content-text-tertiary); }

/* ---------- Layout ---------- */
.ads-container { width: 100%; max-width: calc(var(--ads-content-max) + 2 * var(--ads-grid-margin)); margin-inline: auto; padding-inline: max(var(--ads-grid-margin), env(safe-area-inset-left)) max(var(--ads-grid-margin), env(safe-area-inset-right)); }
.ads-grid { display: grid; grid-template-columns: repeat(var(--ads-grid-columns), minmax(0, 1fr)); column-gap: var(--ads-grid-gutter); row-gap: var(--ads-space-24); }
.ads-reading { max-width: var(--ads-reading-measure); }
.ads-stack { display: flex; flex-direction: column; gap: var(--ads-stack-gap, var(--ads-space-16)); }
.ads-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ads-row-gap, var(--ads-space-12)); }

/* ---------- Button ----------
   Role: primary | secondary | tertiary | destructive. Size: sm 36 | default 44 | lg 60. Icon: left/right/only. State: loading. */
.ads-btn {
  --_bg: var(--ads-background-interactive-primary);
  --_bg-hover: var(--ads-background-interactive-primary-hover);
  --_bg-active: var(--ads-background-interactive-primary-active);
  --_fg: var(--ads-content-text-on-brand);
  --_border: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ads-space-8);
  height: var(--ads-size-interactive-md); padding: 0 var(--ads-space-24);
  border: 1px solid var(--_border); border-radius: var(--ads-radius-4);
  background: var(--_bg); color: var(--_fg);
  font-family: var(--ads-font-family); font-size: var(--ads-type-button-size); line-height: var(--ads-type-button-line-height);
  letter-spacing: var(--ads-type-button-letter-spacing); font-weight: var(--ads-type-button-weight);
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background-color var(--ads-duration-fast) var(--ads-ease), border-color var(--ads-duration-fast) var(--ads-ease);
}
.ads-btn:hover  { background: var(--_bg-hover); }
.ads-btn:active { background: var(--_bg-active); }
.ads-btn:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: var(--ads-focus-ring-offset); }
.ads-btn--secondary { --_bg: var(--ads-background-interactive-secondary); --_bg-hover: var(--ads-background-interactive-secondary-hover); --_bg-active: var(--ads-background-interactive-secondary-active); --_fg: var(--ads-content-text-link); --_border: var(--ads-border-brand); }
.ads-btn--tertiary  { --_bg: transparent; --_bg-hover: var(--ads-background-surface-hover); --_bg-active: var(--ads-background-surface-active); --_fg: var(--ads-content-text-secondary); --_border: var(--ads-border-default); }
.ads-btn--destructive { --_bg: var(--ads-background-interactive-destructive); --_bg-hover: var(--ads-background-interactive-destructive-hover); --_bg-active: var(--ads-background-interactive-destructive-active); --_fg: var(--ads-content-text-on-error); }
.ads-btn--sm { height: var(--ads-size-interactive-sm); font-size: var(--ads-type-button-small-size); line-height: var(--ads-type-button-small-line-height); }
.ads-btn--sm .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }
.ads-btn--lg { height: var(--ads-size-interactive-lg); padding: 0 var(--ads-space-32); gap: var(--ads-space-12); }
.ads-btn--icon-only { width: var(--ads-size-interactive-md); padding: 0; }
.ads-btn--sm.ads-btn--icon-only { width: var(--ads-size-interactive-sm); }
.ads-btn--lg.ads-btn--icon-only { width: var(--ads-size-interactive-lg); }
.ads-btn--block { display: flex; width: 100%; }
.ads-btn:disabled, .ads-btn[aria-disabled="true"] { cursor: not-allowed; background: var(--ads-background-interactive-primary-disabled); color: var(--ads-content-text-disabled); border-color: transparent; }
.ads-btn--secondary:disabled, .ads-btn--tertiary:disabled { background: var(--ads-background-interactive-secondary-disabled); border-color: var(--ads-border-disabled); }
.ads-btn[aria-busy="true"] { pointer-events: none; }
.ads-btn[aria-busy="true"] .ads-icon--spinner-static { animation: ads-spin 0.9s linear infinite; }
@keyframes ads-spin { to { transform: rotate(360deg); } }

/* ---------- Icon Button (sizes 44 / 36 / 24, radius 2) ---------- */
.ads-icon-btn { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--ads-size-interactive-md); height: var(--ads-size-interactive-md); padding: 0; border: 0; border-radius: var(--ads-radius-2); background: transparent; color: var(--ads-content-icon-primary); cursor: pointer; }
.ads-icon-btn:hover  { background: var(--ads-background-surface-hover); }
.ads-icon-btn:active { background: var(--ads-background-surface-active); }
.ads-icon-btn--sm { width: var(--ads-size-interactive-sm); height: var(--ads-size-interactive-sm); }
.ads-icon-btn--xs { width: var(--ads-size-interactive-xs); height: var(--ads-size-interactive-xs); }
.ads-icon-btn--xs .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }
.ads-icon-btn:disabled { color: var(--ads-content-icon-disabled); cursor: not-allowed; background: transparent; }

/* ---------- Link ---------- */
.ads-link { display: inline-flex; align-items: center; gap: var(--ads-space-4); color: var(--ads-content-text-link); text-decoration: underline; text-underline-offset: 0.15em; border-radius: var(--ads-radius-4); }
.ads-link:hover { color: var(--ads-content-text-link-hover); text-decoration-thickness: 2px; }
.ads-link:visited { color: var(--ads-content-text-link-visited); }
.ads-link--sm { font-size: var(--ads-type-body-small-size); line-height: var(--ads-type-body-small-line-height); }
.ads-link .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }

/* ---------- Badge (pill, status always paired with an icon) ---------- */
.ads-badge { --_bg: var(--ads-background-status-neutral); --_fg: var(--ads-content-text-on-neutral);
  display: inline-flex; align-items: center; gap: var(--ads-space-4); min-width: var(--ads-space-24); padding: var(--ads-space-4) var(--ads-space-8);
  border-radius: var(--ads-radius-full); background: var(--_bg); color: var(--_fg);
  font-size: var(--ads-type-body-small-emphasis-size); line-height: var(--ads-size-icon-sm); font-weight: var(--ads-type-body-small-emphasis-weight); white-space: nowrap; }
.ads-badge .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }
.ads-badge--info    { --_bg: var(--ads-background-status-info);    --_fg: var(--ads-content-text-on-info); }
.ads-badge--success { --_bg: var(--ads-background-status-success); --_fg: var(--ads-content-text-on-success); }
.ads-badge--warning { --_bg: var(--ads-background-status-warning); --_fg: var(--ads-content-text-on-warning); }
.ads-badge--error   { --_bg: var(--ads-background-status-error);   --_fg: var(--ads-content-text-on-error); }

/* ---------- Alert ---------- */
.ads-alert { --_bg: var(--ads-background-status-info-subtle); --_border: var(--ads-border-status-info-subtle); --_icon: var(--ads-content-icon-info);
  display: flex; align-items: flex-start; padding-left: var(--ads-space-12); border: 1px solid var(--_border); border-radius: var(--ads-radius-2); background: var(--_bg); color: var(--ads-content-text-primary); }
.ads-alert__icon { margin-top: var(--ads-space-16); color: var(--_icon); }
.ads-alert__content { flex: 1; display: flex; flex-direction: column; gap: var(--ads-space-12); padding: var(--ads-space-16) var(--ads-space-12); min-width: 0; }
.ads-alert__title { margin: 0; font-size: var(--ads-type-body-emphasis-size); font-weight: var(--ads-type-body-emphasis-weight); line-height: var(--ads-type-body-line-height); }
.ads-alert__description { margin: 0; }
.ads-alert--success { --_bg: var(--ads-background-status-success-subtle); --_border: var(--ads-border-status-success-subtle); --_icon: var(--ads-content-icon-success); }
.ads-alert--warning { --_bg: var(--ads-background-status-warning-subtle); --_border: var(--ads-border-status-warning-subtle); --_icon: var(--ads-content-icon-warning); }
.ads-alert--error   { --_bg: var(--ads-background-status-error-subtle);   --_border: var(--ads-border-status-error-subtle);   --_icon: var(--ads-content-icon-error); }

/* ---------- Accordion (uses <details>) ---------- */
.ads-accordion { border-bottom: 1px solid var(--ads-border-subtle); }
.ads-accordion > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: var(--ads-space-16); min-height: var(--ads-size-interactive-lg); padding: 0 var(--ads-space-20); cursor: pointer; font-weight: var(--ads-type-body-emphasis-weight); color: var(--ads-content-text-primary); }
.ads-accordion > summary::-webkit-details-marker { display: none; }
.ads-accordion > summary:hover { background: var(--ads-background-surface-hover); }
.ads-accordion > summary:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }
.ads-accordion > summary .ads-icon { color: var(--ads-content-icon-primary); transition: transform var(--ads-duration-base) var(--ads-ease); }
.ads-accordion[open] > summary .ads-icon { transform: rotate(180deg); }
.ads-accordion__panel { padding: 0 var(--ads-space-20) var(--ads-space-20); color: var(--ads-content-text-secondary); }
.ads-accordion--sm > summary { min-height: var(--ads-size-interactive-md); padding: 0 var(--ads-space-16); font-size: var(--ads-type-body-small-size); }
.ads-accordion--sm > summary .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }
.ads-accordion--sm .ads-accordion__panel { padding: 0 var(--ads-space-16) var(--ads-space-16); }

/* ---------- Card (vertical + horizontal) ---------- */
.ads-card { position: relative; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--ads-border-subtle); border-radius: var(--ads-radius-8); background: var(--ads-background-surface-default); color: var(--ads-content-text-primary); }
.ads-card__media { aspect-ratio: 3 / 2; background: var(--ads-background-surface-sunken); }
.ads-card__media > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ads-card--square .ads-card__media { aspect-ratio: 1; }
.ads-card--portrait .ads-card__media { aspect-ratio: 4 / 5; }
.ads-card__body { display: flex; flex-direction: column; gap: var(--ads-space-24); padding: var(--ads-space-32) var(--ads-space-24); }
.ads-card__text { display: flex; flex-direction: column; gap: var(--ads-space-16); }
.ads-card__text > p { margin: 0; color: var(--ads-content-text-secondary); }
.ads-card--link:hover { border-color: var(--ads-border-strong); }
.ads-card--link:focus-within { outline: 2px solid var(--ads-border-focus); outline-offset: -1px; }
.ads-card--link .ads-card__action::after { content: ""; position: absolute; inset: 0; }
.ads-card--link .ads-card__action:focus-visible { outline: none; }
.ads-card--horizontal { flex-direction: row; min-height: 280px; }
.ads-card--horizontal .ads-card__media { aspect-ratio: auto; flex: 0 0 calc(100% / 3); }
.ads-card--horizontal.ads-card--half .ads-card__media { flex-basis: 50%; }
.ads-card--horizontal.ads-card--two-thirds .ads-card__media { flex-basis: calc(200% / 3); }
.ads-card--horizontal .ads-card__body { flex: 1; justify-content: center; }
@media (max-width: 639px) { .ads-card--horizontal { flex-direction: column; } .ads-card--horizontal .ads-card__media { aspect-ratio: 3 / 2; flex-basis: auto; } }

/* ---------- Checkbox & Radio (44px target, 24px glyph) ---------- */
.ads-choice { display: flex; align-items: flex-start; gap: var(--ads-space-4); min-height: var(--ads-size-interactive-md); cursor: pointer; color: var(--ads-content-text-primary); }
.ads-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ads-choice__control { flex: none; display: grid; place-items: center; width: var(--ads-size-interactive-md); height: var(--ads-size-interactive-md); border-radius: var(--ads-radius-8); color: var(--ads-content-icon-secondary); }
.ads-choice__control::before { content: ""; width: var(--ads-size-icon-md); height: var(--ads-size-icon-md); background: currentColor; -webkit-mask: var(--_glyph) center/contain no-repeat; mask: var(--_glyph) center/contain no-repeat; }
.ads-choice__label { display: flex; flex-direction: column; padding-top: 10px; }
.ads-choice__supporting { color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); line-height: var(--ads-type-body-small-line-height); }
.ads-choice:hover .ads-choice__control { background: var(--ads-background-surface-hover); color: var(--ads-content-icon-tertiary); }
.ads-choice input:checked + .ads-choice__control, .ads-choice input:indeterminate + .ads-choice__control { color: var(--ads-content-icon-brand); }
.ads-choice:hover input:checked + .ads-choice__control { color: var(--ads-content-icon-brand-hover); }
.ads-choice input:focus-visible + .ads-choice__control { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -4px; }
.ads-choice:has(input:disabled) { cursor: not-allowed; color: var(--ads-content-text-disabled); }
.ads-choice input:disabled + .ads-choice__control { color: var(--ads-content-icon-disabled); background: none; }
.ads-checkbox .ads-choice__control { --_glyph: var(--ads-glyph-checkbox-unselected); }
.ads-checkbox input:checked + .ads-choice__control { --_glyph: var(--ads-glyph-checkbox-selected); }
.ads-checkbox input:indeterminate + .ads-choice__control { --_glyph: var(--ads-glyph-checkbox-partial); }
.ads-radio .ads-choice__control { border-radius: var(--ads-radius-full); --_glyph: var(--ads-glyph-radio-unselected); }
.ads-radio input:checked + .ads-choice__control { --_glyph: var(--ads-glyph-radio-selected); }
.ads-fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--ads-space-8); }
.ads-fieldset > legend { padding: 0; margin-bottom: var(--ads-space-8); }
.ads-fieldset__options { display: flex; flex-direction: column; }
.ads-fieldset--inline .ads-fieldset__options { flex-direction: row; gap: var(--ads-space-12); }

/* ---------- Switch (44 target, 44x24 track) ---------- */
.ads-switch { display: inline-flex; align-items: center; gap: var(--ads-space-12); cursor: pointer; }
.ads-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ads-switch__track { position: relative; flex: none; width: var(--ads-size-interactive-md); height: var(--ads-size-icon-md); border-radius: var(--ads-radius-full); background: var(--ads-content-icon-secondary); transition: background-color var(--ads-duration-fast) var(--ads-ease); margin-block: 10px; }
.ads-switch__track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--ads-background-interactive-secondary); transition: transform var(--ads-duration-base) var(--ads-ease); }
.ads-switch:hover .ads-switch__track { background: var(--ads-content-icon-tertiary); }
.ads-switch input:checked + .ads-switch__track { background: var(--ads-content-icon-brand); }
.ads-switch:hover input:checked + .ads-switch__track { background: var(--ads-content-icon-brand-hover); }
.ads-switch input:checked + .ads-switch__track::after { transform: translateX(20px); }
.ads-switch input:focus-visible + .ads-switch__track { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: var(--ads-focus-ring-offset); }
.ads-switch input:disabled + .ads-switch__track { background: var(--ads-content-icon-disabled); }
.ads-switch input:disabled + .ads-switch__track::after { background: var(--ads-background-interactive-secondary-disabled); }
.ads-switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--ads-space-16); min-height: var(--ads-size-interactive-md); }

/* ---------- Counter ---------- */
.ads-counter { display: inline-flex; align-items: center; height: var(--ads-size-interactive-md); border: 1px solid var(--ads-border-default); border-radius: var(--ads-radius-4); background: var(--ads-background-surface-default); overflow: hidden; }
.ads-counter__step { display: grid; place-items: center; width: var(--ads-size-interactive-md); height: 100%; border: 0; padding: 0; background: var(--ads-background-interactive-secondary); color: var(--ads-content-icon-primary); cursor: pointer; }
.ads-counter__step:hover { background: var(--ads-background-interactive-secondary-hover); }
.ads-counter__step:active { background: var(--ads-background-interactive-secondary-active); }
.ads-counter__step:disabled { background: var(--ads-background-interactive-secondary-disabled); color: var(--ads-content-icon-disabled); cursor: not-allowed; }
.ads-counter__step:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }
.ads-counter__value { width: var(--ads-size-interactive-md); text-align: center; font-weight: var(--ads-type-body-emphasis-weight); font-variant-numeric: tabular-nums; }
.ads-counter--sm { height: var(--ads-size-interactive-sm); }
.ads-counter--sm .ads-counter__step, .ads-counter--sm .ads-counter__value { width: var(--ads-size-interactive-sm); }
.ads-counter--sm .ads-counter__value { font-size: var(--ads-type-body-small-size); }
.ads-counter--sm .ads-icon { width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); }
.ads-counter[aria-disabled="true"] { background: var(--ads-background-interactive-secondary-disabled); border-color: var(--ads-border-disabled); color: var(--ads-content-text-disabled); }

/* ---------- Form field: Text Input, Select, Search, Textarea ---------- */
.ads-field { display: flex; flex-direction: column; gap: var(--ads-space-8); min-width: 0; }
.ads-field__label { display: flex; align-items: center; gap: var(--ads-space-4); color: var(--ads-content-text-secondary); font-size: var(--ads-type-field-label-size); line-height: var(--ads-type-field-label-line-height); font-weight: var(--ads-type-field-label-weight); }
.ads-field__marker { font-size: var(--ads-type-caption-size); font-weight: var(--ads-font-weight-regular); }
.ads-field__marker--required { color: var(--ads-content-text-warning); }
.ads-field__marker--optional { color: var(--ads-content-text-tertiary); }
.ads-control { --_border: var(--ads-border-default); --_border-w: 1px;

/* ---------- List (menu surface + rows) ---------- */
.ads-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--ads-border-subtle); border-radius: var(--ads-radius-4); background: var(--ads-background-surface-raised); box-shadow: var(--ads-shadow-elevation-md); overflow: hidden; }

/* ---------- Modal ---------- */

/* ---------- Tabs ---------- */
.ads-tabs { display: flex; overflow-x: auto; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--ads-border-subtle); }
.ads-tab { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: var(--ads-space-8); height: var(--ads-size-interactive-md); padding: 0 var(--ads-space-12); border: 0; border-radius: var(--ads-radius-2) var(--ads-radius-2) 0 0; background: none; color: var(--ads-content-text-secondary); font: inherit; cursor: pointer; }

/* ---------- Mobile: Top Navigation (from ADS NextGen Mobile App) ---------- */

/* ---------- Liquid Glass material (from Apple iOS & iPadOS 27 kit) ----------

   backdrop blur + saturation, the kit's translucent fill, its 0.5px edge and its soft lift shadow. */

  --ads-glass-fill: rgb(250 250 250 / 0.62);
  --ads-glass-edge: rgb(232 232 232 / 1);
  --ads-glass-sheen: rgb(255 255 255 / 0.7);
  --ads-glass-blur: 12px;
  --ads-glass-selection: rgb(0 0 0 / 0.07);
  --ads-glass-ink: #1a1a1a;
  --ads-glass-ink-muted: #1a1a1a;
  --ads-glass-tint: var(--ads-content-icon-brand);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ads-glass-fill: rgb(44 44 48 / 0.62); --ads-glass-edge: rgb(166 166 166 / 0.45); --ads-glass-sheen: rgb(255 255 255 / 0.14);
  --ads-glass-selection: rgb(255 255 255 / 0.12); --ads-glass-ink: #f5f5f5; --ads-glass-ink-muted: #8a8a8a; --ads-glass-tint: var(--ads-color-blue-200); } }

  --ads-glass-fill: rgb(44 44 48 / 0.62); --ads-glass-edge: rgb(166 166 166 / 0.45); --ads-glass-sheen: rgb(255 255 255 / 0.14);
  --ads-glass-selection: rgb(255 255 255 / 0.12); --ads-glass-ink: #f5f5f5; --ads-glass-ink-muted: #8a8a8a; --ads-glass-tint: var(--ads-color-blue-200); }

  background: var(--ads-glass-fill);
  -webkit-backdrop-filter: blur(var(--ads-glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--ads-glass-blur)) saturate(180%);
  border-radius: var(--ads-radius-full);
  box-shadow: 0 8px 15px rgb(0 0 0 / 0.04), 0 0 0 0.5px var(--ads-glass-edge), inset 0 1px 0 var(--ads-glass-sheen), inset 0 -1px 0 rgb(0 0 0 / 0.04);
}

/* ---------- iPhone Tab Bar ----------
   Floating 62px glass capsule of 2–5 tabs (54px tall), 25px from the screen sides and bottom.
   Optional separate 62px circle for Search (Type=Search Role) or a filled action (Type=Prominent Tab).
   --minimized collapses to 48px circles showing only the current tab. */

  padding: var(--ads-space-16) 25px max(25px, env(safe-area-inset-bottom)); font-family: var(--ads-font-family); }

.ads-tabbar__tab { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  height: 54px; padding: 6px 4px 7px; border: 0; border-radius: var(--ads-radius-full); background: none; color: var(--ads-glass-ink);
  font: 600 10px/12px var(--ads-font-family); letter-spacing: 0; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ads-tabbar__tab .ads-icon { width: 22px; height: 22px; margin-block: 3px; }

.ads-tabbar__tab[aria-current="page"], .ads-tabbar__tab[aria-selected="true"] { background: var(--ads-glass-selection); color: var(--ads-glass-tint); letter-spacing: -0.1px; }
.ads-tabbar__tab:focus-visible, .ads-tabbar__action:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }
.ads-tabbar__action { flex: none; display: grid; place-items: center; width: 62px; height: 62px; padding: 0; border: 0; color: var(--ads-glass-ink); cursor: pointer; }
.ads-tabbar__action .ads-icon { width: 22px; height: 22px; }
.ads-tabbar__action--prominent { background: var(--ads-background-interactive-primary); color: var(--ads-content-icon-on-brand); -webkit-backdrop-filter: none; backdrop-filter: none; }
/* Minimized: the bar shrinks to the current tab while content scrolls */

/* Optional accessory that sits between the minimized tab and search, e.g. a now-boarding strip */
.ads-tabbar__accessory { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--ads-space-8); height: 48px; padding: 0 var(--ads-space-16); font-size: 15px; color: var(--ads-glass-ink); }

/* ---------- iPad Tab Bar ----------
   44px glass capsule centered at the top of the window: sidebar toggle (54×36), text tabs (36px, 15pt),
   search (54×36). Selected tab: bold, tinted, on a selection capsule. */
.ads-tabbar-ipad { display: inline-flex; align-items: center; height: 44px; padding: 4px; max-width: 100%; font-family: var(--ads-font-family); }
.ads-tabbar-ipad__tabs { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.ads-tabbar-ipad__tab, .ads-tabbar-ipad__button { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 36px; border: 0; border-radius: var(--ads-radius-full);
  background: none; color: var(--ads-glass-ink); font: 500 15px/20px var(--ads-font-family); letter-spacing: -0.23px; text-decoration: none; white-space: nowrap; cursor: pointer; }
.ads-tabbar-ipad__tab { padding: 8px 18px; }
.ads-tabbar-ipad__button { width: 54px; padding: 8px 16px; }
.ads-tabbar-ipad__button .ads-icon { width: 20px; height: 20px; }
[data-theme="dark"] .ads-tabbar-ipad__tab:not([aria-current="page"]):not([aria-selected="true"]) { color: var(--ads-glass-ink-muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ads-tabbar-ipad__tab:not([aria-current="page"]):not([aria-selected="true"]) { color: var(--ads-glass-ink-muted); } }
.ads-tabbar-ipad__tab[aria-current="page"], .ads-tabbar-ipad__tab[aria-selected="true"], .ads-tabbar-ipad__button[aria-pressed="true"] { background: var(--ads-glass-selection); color: var(--ads-glass-tint); font-weight: 700; }
.ads-tabbar-ipad__tab:focus-visible, .ads-tabbar-ipad__button:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }
/* Window chrome row that holds the iPad bar: centered, with room for leading/trailing nav items */
.ads-ipad-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--ads-space-16); padding: max(var(--ads-space-12), env(safe-area-inset-top)) var(--ads-space-24) var(--ads-space-12); }

/* ---------- App shell: Global Header (Amtrak IA · App Shell Overview) ----------

   Both open as sheets. Persistent across all four tabs. */
.ads-appheader { display: flex; align-items: center; gap: var(--ads-space-12); min-height: 60px; padding: max(var(--ads-space-8), env(safe-area-inset-top)) var(--ads-grid-margin) var(--ads-space-8); background: var(--ads-background-surface-default); border-bottom: 1px solid var(--ads-border-subtle); }
.ads-appheader__account { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--ads-space-12); padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: var(--ads-radius-8); }
.ads-appheader__account:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 2px; }
.ads-avatar { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--ads-radius-full); background: var(--ads-background-surface-inverse); color: var(--ads-content-text-on-inverse); font-size: 13px; font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.02em; }

.ads-icon-btn--round { border-radius: var(--ads-radius-full); background: var(--ads-background-surface-sunken); }
.ads-icon-btn__dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--ads-background-status-error); box-shadow: 0 0 0 2px var(--ads-background-surface-default); }

/* ---------- Segmented control (used by Book, Trips, Train Status) ---------- */
.ads-segmented { display: flex; padding: 3px; border-radius: var(--ads-radius-full); background: var(--ads-background-surface-sunken); }
.ads-segmented > button { flex: 1; min-width: 0; height: 34px; padding: 0 var(--ads-space-12); border: 0; border-radius: var(--ads-radius-full); background: none; color: var(--ads-content-text-secondary); font: inherit; font-size: var(--ads-type-body-small-size); cursor: pointer; white-space: nowrap; }
.ads-segmented > button[aria-pressed="true"], .ads-segmented > button[aria-selected="true"] { background: var(--ads-background-surface-raised); color: var(--ads-content-text-primary); font-weight: var(--ads-font-weight-semibold); box-shadow: var(--ads-shadow-elevation-xs); }
.ads-segmented > button:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }

/* ---------- Sheet (Account, Notification Inbox, New Booking) ---------- */
.ads-sheet { display: flex; flex-direction: column; gap: var(--ads-space-16); padding: var(--ads-space-8) var(--ads-space-16) max(var(--ads-space-24), env(safe-area-inset-bottom)); border-radius: var(--ads-radius-12) var(--ads-radius-12) 0 0; background: var(--ads-background-surface-page); box-shadow: var(--ads-shadow-elevation-xl); color: var(--ads-content-text-primary); }
.ads-sheet__grabber { align-self: center; width: 36px; height: 5px; border-radius: var(--ads-radius-full); background: var(--ads-border-default); opacity: 0.5; }
.ads-sheet__bar { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
.ads-sheet__title { margin: 0; }

/* ---------- eTicket card (Trips · Active) ---------- */
.ads-ticket { display: flex; flex-direction: column; gap: var(--ads-space-12); padding: var(--ads-space-12); border-radius: var(--ads-radius-12); background: var(--ads-background-surface-inverse); color: var(--ads-content-text-on-inverse); }
.ads-ticket__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--ads-space-8); padding: var(--ads-space-4) var(--ads-space-4) 0; font-variant-numeric: tabular-nums; }
.ads-ticket__route { font-weight: var(--ads-font-weight-semibold); font-size: var(--ads-type-body-size); }
.ads-ticket__date { font-size: var(--ads-type-caption-size); opacity: 0.8; }
.ads-ticket__pass { display: flex; align-items: center; gap: var(--ads-space-12); padding: var(--ads-space-12); border-radius: var(--ads-radius-8); background: var(--ads-color-neutral-50); color: var(--ads-color-blue-950); }
.ads-ticket__pass > .ads-icon { width: 52px; height: 52px; }
.ads-ticket__wallet { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: var(--ads-radius-8); background: var(--ads-color-neutral-950); color: var(--ads-color-neutral-50); font: 600 12px/1 var(--ads-font-family); cursor: pointer; white-space: nowrap; }
.ads-ticket__wallet:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 2px; }
.ads-ticket__seat { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; flex-direction: column; font-weight: var(--ads-font-weight-semibold); font-size: var(--ads-type-body-small-size); }
.ads-ticket__seat small { font: 11px var(--ads-font-family); letter-spacing: 0.2em; color: var(--ads-color-neutral-600); font-weight: 400; }
.ads-ticket__status { display: flex; align-items: center; gap: var(--ads-space-8); padding: 0 var(--ads-space-4) var(--ads-space-4); font-size: var(--ads-type-caption-size); }
.ads-ticket__status b { display: block; font-size: var(--ads-type-body-small-size); }
.ads-ticket__status > span:nth-child(2) { flex: 1; min-width: 0; }
.ads-ticket__status a { color: inherit; font-weight: var(--ads-font-weight-semibold); text-decoration: none; display: inline-flex; align-items: center; }
.ads-ticket__live { width: 8px; height: 8px; border-radius: 50%; background: var(--ads-color-green-400); flex: none; }

/* ============================================================
   Sprint 4 additions
   Added for the Sprint 4 exploration (booking, Profile, discounts, assistance,
   verification). Each one is documented in README.md and prototypes/sprint4/HANDOFF.md.
   ============================================================ */

/* ---------- Nav bar ----------
   Header for sheets and the screens pushed inside them.
   Root of a sheet: title + Close. Pushed: Back + title + Close. Focused editor: Cancel + title + Save. */
.ads-navbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--ads-space-8);
  min-height: 52px; padding: var(--ads-space-4) var(--ads-space-8); background: var(--ads-background-surface-page); }
.ads-navbar__lead { justify-self: start; display: flex; align-items: center; min-width: 0; }
.ads-navbar__trail { justify-self: end; display: flex; align-items: center; gap: var(--ads-space-4); min-width: 0; }
.ads-navbar__title { margin: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
  font-size: var(--ads-type-body-emphasis-size); font-weight: var(--ads-type-body-emphasis-weight); line-height: 1.25; }
.ads-navbar__btn { display: inline-flex; align-items: center; gap: 2px; min-height: var(--ads-size-interactive-md); min-width: var(--ads-size-interactive-md);
  padding: 0 var(--ads-space-8); border: 0; border-radius: var(--ads-radius-8); background: none; color: var(--ads-content-text-link);
  font: inherit; font-size: var(--ads-type-body-size); cursor: pointer; white-space: nowrap; }
.ads-navbar__btn:hover { background: var(--ads-background-surface-hover); }
.ads-navbar__btn--strong { font-weight: var(--ads-font-weight-semibold); }
.ads-navbar__btn:disabled { color: var(--ads-content-text-disabled); cursor: not-allowed; background: none; }
.ads-navbar__btn[aria-busy="true"] { color: var(--ads-content-text-secondary); }
.ads-navbar__btn[aria-busy="true"] .ads-icon--spinner-static { animation: ads-spin 0.9s linear infinite; }
.ads-navbar__btn:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -2px; }
.ads-navbar--large .ads-navbar__title { visibility: hidden; }

/* ---------- Grouped rows ----------
   Inset groups of rows for Account, Profile and settings. A row can be a button (navigates or edits),
   a read-only value, or a locked value. Locked shows a "Can't be changed" label, so the state never relies on color. */
.ads-group { display: flex; flex-direction: column; gap: var(--ads-space-8); }
.ads-group__title { margin: 0 var(--ads-space-16); color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); line-height: var(--ads-type-caption-line-height); font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; }
.ads-group__body { display: flex; flex-direction: column; border-radius: var(--ads-radius-12); background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-subtle); overflow: hidden; }
.ads-group__foot { margin: 0 var(--ads-space-16); color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); line-height: var(--ads-type-caption-line-height); }
.ads-group__row { display: flex; align-items: center; gap: var(--ads-space-12); width: 100%; min-height: 52px; padding: var(--ads-space-8) var(--ads-space-16);
  border: 0; background: none; color: inherit; font: inherit; text-align: left; text-decoration: none; }
.ads-group__row + .ads-group__row, .ads-group__row + .ads-group__panel, .ads-group__panel + .ads-group__row { border-top: 1px solid var(--ads-border-subtle); }
button.ads-group__row, a.ads-group__row, label.ads-group__row { cursor: pointer; }
button.ads-group__row:hover, a.ads-group__row:hover { background: var(--ads-background-surface-hover); }
button.ads-group__row:focus-visible, a.ads-group__row:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -3px; }
.ads-group__row[aria-current="true"] { background: var(--ads-background-surface-selected); }
.ads-group__lead { flex: none; color: var(--ads-content-icon-brand); }
.ads-group__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ads-group__label { font-size: var(--ads-type-body-size); line-height: 1.3; }
.ads-group__value { color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); line-height: 1.35; overflow-wrap: anywhere; }
.ads-group__value--empty { color: var(--ads-content-text-tertiary); font-style: italic; }
.ads-group__meta { flex: none; display: inline-flex; align-items: center; gap: var(--ads-space-4); color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); }
.ads-group__row > .ads-icon--chevron-right { flex: none; color: var(--ads-content-icon-tertiary); }
.ads-group__row--destructive .ads-group__label { color: var(--ads-content-text-error); }
.ads-group__row--action .ads-group__label { color: var(--ads-content-text-link); }
.ads-group__row[aria-disabled="true"] { color: var(--ads-content-text-disabled); cursor: not-allowed; }
.ads-group__row[aria-disabled="true"] .ads-group__label { color: var(--ads-content-text-disabled); }
.ads-group__panel { padding: var(--ads-space-16); display: flex; flex-direction: column; gap: var(--ads-space-16); background: var(--ads-background-surface-default); }
.ads-lock { display: inline-flex; align-items: center; gap: var(--ads-space-4); padding: 2px var(--ads-space-8); border-radius: var(--ads-radius-full); border: 1px solid var(--ads-border-default); color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); line-height: 1.4; white-space: nowrap; }

/* ---------- Station row ----------
   Station result: code, city/state, station name, and a 44px star toggle (aria-pressed).
   Favorite is shown by the filled star AND the toggle's label, not by color alone. */
.ads-stationrow { display: flex; align-items: stretch; min-height: 60px; border-bottom: 1px solid var(--ads-border-subtle); background: var(--ads-background-surface-default); }
.ads-stationrow__select { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--ads-space-12); padding: var(--ads-space-8) var(--ads-space-4) var(--ads-space-8) var(--ads-space-16);
  border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ads-stationrow__select:hover { background: var(--ads-background-surface-hover); }
.ads-stationrow__select:focus-visible, .ads-stationrow__star:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -3px; }
.ads-stationrow__code { flex: none; width: 44px; font-weight: var(--ads-font-weight-semibold); font-size: var(--ads-type-body-size); letter-spacing: 0.02em; }
.ads-stationrow__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ads-stationrow__name { font-size: var(--ads-type-body-size); line-height: 1.3; }
.ads-stationrow__detail { color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); line-height: 1.3; }
.ads-stationrow__tag { align-self: flex-start; margin-top: 2px; }
.ads-stationrow__star { flex: none; display: grid; place-items: center; width: var(--ads-size-interactive-md); min-height: var(--ads-size-interactive-md); margin: auto var(--ads-space-4); border: 0; border-radius: var(--ads-radius-8); background: none; color: var(--ads-content-icon-secondary); cursor: pointer; }
.ads-stationrow__star:hover { background: var(--ads-background-surface-hover); }
.ads-stationrow__star[aria-pressed="true"] { color: var(--ads-content-icon-brand); }
.ads-stationrow[aria-current="true"] .ads-stationrow__select { background: var(--ads-background-surface-selected); }
.ads-stationrow__header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--ads-space-8); min-height: 36px; padding: var(--ads-space-8) var(--ads-space-16);
  background: var(--ads-background-surface-sunken); color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--ads-border-subtle); }

/* ---------- Route field ----------
   From/To pair with a swap button (Core Flow). Each half is a button that opens station search. */
.ads-routefield { position: relative; display: flex; flex-direction: column; border-radius: var(--ads-radius-12); background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-default); }
.ads-routefield__half { display: flex; align-items: center; gap: var(--ads-space-12); min-height: 68px; padding: var(--ads-space-8) 64px var(--ads-space-8) var(--ads-space-16);
  border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: var(--ads-radius-12); width: 100%; }
.ads-routefield__half + .ads-routefield__half { border-top: 1px solid var(--ads-border-subtle); border-radius: 0 0 var(--ads-radius-12) var(--ads-radius-12); }
.ads-routefield__half:hover { background: var(--ads-background-surface-hover); }
.ads-routefield__half:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -3px; }
.ads-routefield__half[aria-invalid="true"] { box-shadow: inset 3px 0 0 var(--ads-border-status-error); }
.ads-routefield__half[aria-expanded="true"] { background: var(--ads-background-surface-selected); }
.ads-routefield__half[aria-expanded="true"] .ads-routefield__city { color: var(--ads-content-text-primary); }
.ads-routefield__label { display: block; color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); letter-spacing: 0.06em; text-transform: uppercase; }
.ads-routefield__code { flex: none; width: 48px; font-size: var(--ads-type-h4-headline-size); font-weight: var(--ads-font-weight-semibold); }
.ads-routefield__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ads-routefield__city { font-size: var(--ads-type-body-size); color: var(--ads-content-text-link); line-height: 1.25; }
.ads-routefield__station { font-size: var(--ads-type-body-small-size); color: var(--ads-content-text-secondary); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ads-routefield__hint { color: var(--ads-content-text-tertiary); }
.ads-routefield__swap { position: absolute; right: var(--ads-space-8); top: 50%; transform: translateY(-50%); z-index: 1; background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-subtle); border-radius: var(--ads-radius-full); }

/* ---------- Date field ----------
   Tappable date: label, day name and full date. Empty shows an "Add" action. */
.ads-datefields { display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--ads-radius-12); background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-default); overflow: hidden; }
.ads-datefield { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 68px; padding: var(--ads-space-8) var(--ads-space-16); border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.ads-datefield + .ads-datefield { border-left: 1px solid var(--ads-border-subtle); }
.ads-datefield:hover { background: var(--ads-background-surface-hover); }
.ads-datefield:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: -3px; }
.ads-datefield[aria-expanded="true"], .ads-datefield[aria-current="true"] { background: var(--ads-background-surface-selected); }
.ads-datefield__label { color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); letter-spacing: 0.06em; text-transform: uppercase; }
.ads-datefield__value { font-size: var(--ads-type-body-size); line-height: 1.25; }
.ads-datefield__day { color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); }
.ads-datefield__add { display: inline-flex; align-items: center; gap: var(--ads-space-4); color: var(--ads-content-text-link); }

/* ---------- Calendar ----------
   Vertical month list for phones and sheets. Reuses .ads-day cells from the date picker.
   The range is marked with aria-pressed plus "Depart"/"Return" in each cell's accessible name. */
.ads-calendar { display: flex; flex-direction: column; gap: var(--ads-space-16); }
.ads-calendar__weekdays { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: repeat(7, 1fr); padding: var(--ads-space-8) 0; background: var(--ads-background-surface-page); border-bottom: 1px solid var(--ads-border-subtle); }
.ads-calendar__weekdays span { text-align: center; color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); }
.ads-calendar__month h3 { margin: 0 0 var(--ads-space-8); font-size: var(--ads-type-body-emphasis-size); font-weight: var(--ads-type-body-emphasis-weight); }
.ads-calendar__grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.ads-calendar__grid .ads-day { width: 100%; height: var(--ads-size-interactive-md); isolation: isolate; }
.ads-calendar__grid .ads-day::before { inset: 0; margin: auto; width: var(--ads-size-interactive-md); height: var(--ads-size-interactive-md); }

/* ---------- Steps ----------
   For guided flows. The rail lists the steps with a numbered marker and a state word for screen readers.
   Done shows a check, current is bold and outlined, skipped is struck through with "Skipped". */
.ads-steps { display: flex; flex-direction: column; gap: var(--ads-space-4); margin: 0; padding: 0; list-style: none; }
.ads-steps__item { display: flex; align-items: center; gap: var(--ads-space-12); min-height: var(--ads-size-interactive-md); padding: 0 var(--ads-space-8); border-radius: var(--ads-radius-8); color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); }
.ads-steps__marker { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--ads-radius-full); border: 1px solid var(--ads-border-default); font-weight: var(--ads-font-weight-semibold); font-size: var(--ads-type-caption-size); background: var(--ads-background-surface-default); }
.ads-steps__item[aria-current="step"] { color: var(--ads-content-text-primary); font-weight: var(--ads-font-weight-semibold); background: var(--ads-background-surface-selected); }
.ads-steps__item[aria-current="step"] .ads-steps__marker { border: 2px solid var(--ads-border-brand); color: var(--ads-content-text-link); }
.ads-steps__item--done .ads-steps__marker { background: var(--ads-background-interactive-selected); border-color: transparent; color: var(--ads-content-text-on-inverse); }
.ads-steps__item--skipped { text-decoration: line-through; color: var(--ads-content-text-tertiary); }
.ads-steps__progress { display: flex; flex-direction: column; gap: var(--ads-space-8); }
.ads-steps__count { color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; }
.ads-steps__bar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.ads-steps__bar i { height: 4px; border-radius: var(--ads-radius-full); background: var(--ads-border-subtle); }
.ads-steps__bar i.is-done { background: var(--ads-background-interactive-selected); }

/* ---------- Summary ----------
   Saved answers with an Edit action. Used for assistance, the booking review and V3 overview cards. */
.ads-summary { display: flex; flex-direction: column; gap: var(--ads-space-12); padding: var(--ads-space-16); border-radius: var(--ads-radius-12); background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-subtle); }
.ads-summary__head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--ads-space-8) var(--ads-space-12); }
.ads-summary__head > div { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.ads-summary__title { margin: 0; font-size: var(--ads-type-body-emphasis-size); font-weight: var(--ads-type-body-emphasis-weight); line-height: 1.3; }
.ads-summary__list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--ads-space-8); }
.ads-summary__list li { display: flex; gap: var(--ads-space-8); font-size: var(--ads-type-body-small-size); line-height: 1.4; }
.ads-summary__list li > .ads-icon { flex: none; color: var(--ads-content-icon-success); width: var(--ads-size-icon-sm); height: var(--ads-size-icon-sm); margin-top: 2px; }
.ads-summary__list dt { color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); }
.ads-summary__list dd { margin: 0 0 var(--ads-space-8); }
.ads-summary--editing { border: 2px solid var(--ads-border-brand); }
.ads-summary--empty { border-style: dashed; color: var(--ads-content-text-secondary); }

/* ---------- Code input ----------
   One field with one-time-code autofill, drawn as six cells. A single input keeps paste, autofill
   and screen readers simple; the cells are decoration that mirror its value. */
.ads-codeinput { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--ads-space-8); max-width: 360px; }
.ads-codeinput__cell { display: grid; place-items: center; height: 56px; border-radius: var(--ads-radius-8); background: var(--ads-background-surface-default); box-shadow: inset 0 0 0 1px var(--ads-border-default); font-size: var(--ads-type-h3-headline-size); font-variant-numeric: tabular-nums; }
.ads-codeinput__input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.01; border: 0; font-size: 16px; letter-spacing: 2em; color: transparent; caret-color: transparent; background: none; }
.ads-codeinput:focus-within .ads-codeinput__cell.is-next { box-shadow: inset 0 0 0 2px var(--ads-border-focus); }
.ads-codeinput:focus-within { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 4px; border-radius: var(--ads-radius-8); }
.ads-codeinput--error .ads-codeinput__cell { box-shadow: inset 0 0 0 2px var(--ads-border-status-error); }
.ads-codeinput--success .ads-codeinput__cell { box-shadow: inset 0 0 0 2px var(--ads-border-status-success); }
.ads-codeinput[aria-busy="true"] .ads-codeinput__cell { background: var(--ads-background-surface-sunken); color: var(--ads-content-text-secondary); }

/* ---------- Screen pieces ---------- */

.assistbox { display: flex; flex-direction: column; gap: var(--ads-space-12); padding: var(--ads-space-12); border-radius: var(--ads-radius-12); background: var(--ads-background-status-info-subtle); border: 1px solid var(--ads-border-status-info-subtle); }

.wizfoot { display: flex; gap: var(--ads-space-8); }

.revrow { display: flex; align-items: center; justify-content: space-between; gap: var(--ads-space-12); padding: var(--ads-space-12) 0; border-bottom: 1px solid var(--ads-border-subtle); }
.revrow p { margin: 2px 0 0; }
.inlinepanel { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: var(--ads-radius-12); border: 2px solid var(--ads-border-brand); background: var(--ads-background-surface-page); }

.condfield { margin: 0 0 var(--ads-space-8) var(--ads-space-48); }
.linkbtn { align-self: flex-start; min-height: var(--ads-size-interactive-md); padding: 0; border: 0; background: none; font: inherit; font-size: var(--ads-type-body-small-size); cursor: pointer; }
.tworow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--ads-space-12); }
.field--narrow { max-width: 200px; }

.field--mid { max-width: 260px; }

.rules { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: var(--ads-space-4) var(--ads-space-12); font-size: var(--ads-type-body-small-size); }

.loyalty { display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 16px; border: 0; border-radius: 12px; background: var(--ads-background-surface-inverse); color: var(--ads-content-text-on-inverse); font: inherit; text-align: left; cursor: pointer; }

/* Station search */
.ss-search { position: sticky; top: -8px; z-index: 2; margin: -8px -16px 0; padding: var(--ads-space-8) var(--ads-space-16) var(--ads-space-4); background: var(--ads-background-surface-page); display: flex; flex-direction: column; gap: var(--ads-space-4); }
.inlinepanel .ss-search { position: static; margin: 0; padding: 0; background: none; }
.stsection { margin: 0 -16px; }

.stlist { margin: 0 -16px; padding: 0; list-style: none; }
.stsection .stlist { margin: 0; }
.ss-allhead { margin: var(--ads-space-8) var(--ads-space-16); font-weight: var(--ads-font-weight-semibold); font-size: var(--ads-type-body-small-size); }
.ss-empty { display: flex; flex-direction: column; gap: var(--ads-space-4); margin: 0; padding: var(--ads-space-24) var(--ads-space-8); text-align: center; color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); }
.ss-empty b { color: var(--ads-content-text-primary); font-size: var(--ads-type-body-size); }

.inlinepanel .ads-stationrow { background: transparent; }

/* Calendar */

/* Handoff */
.handoff { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 12px; border: 2px dashed var(--pq-edge); background: var(--pq-bg); }

.handoff__tag { align-self: flex-start; padding: 2px 8px; border-radius: 6px; background: var(--pq); color: var(--pq-bg); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

/* Verification */
.vf-links { display: flex; flex-wrap: wrap; gap: var(--ads-space-8); }

.vf-success h3, .vf-success p { margin: 0; }

/* ---------- Prototype annotations (not product UI) ---------- */
.pdemo { display: flex; gap: 8px; margin: 0; padding: 10px 12px; border-radius: 8px; border: 1.5px dashed var(--pq-edge); background: var(--pq-bg); color: var(--ads-content-text-primary); font-size: 12px; line-height: 1.45; }
.pdemo > .ads-icon { color: var(--pq); margin-top: 1px; flex: none; }
.notes-off .pdemo { display: none; } /* annotations are never shown */

/* ---------- Handoff document view ---------- */
.doc { max-width: 980px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 64px; font-size: 15px; line-height: 1.55; }
.doc h1 { font-size: 28px; margin: 0 0 8px; }
.doc h2 { font-size: 20px; margin: 36px 0 10px; padding-top: 12px; border-top: 1px solid var(--ads-border-subtle); }
.doc h3 { font-size: 16px; margin: 22px 0 8px; }

.doc th, .doc td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--ads-border-subtle); min-width: 120px; }
.doc th { background: var(--ads-background-surface-default); font-weight: 600; }
.doc code { font-size: 0.9em; padding: 1px 4px; border-radius: 4px; background: var(--ads-background-surface-default); }
.doc ul { padding-left: 22px; }
.doc li { margin: 3px 0; }
.doc ul:has(> li > input[type="checkbox"]) { list-style: none; padding-left: 4px; }
.doc li > input[type="checkbox"] { margin-right: 6px; accent-color: var(--ads-content-icon-success); }
[data-ri-edit] { display: flex; flex-direction: column; gap: 16px; }
.loyalty .ads-badge { --_bg: var(--ads-background-surface-page); --_fg: var(--ads-content-text-primary); }
/* Touch targets: on phone and tablet every control is at least 44 × 44 */
.device .ads-btn--sm { height: var(--ads-size-interactive-md); }
.device .ads-icon-btn--sm { width: var(--ads-size-interactive-md); height: var(--ads-size-interactive-md); }
.device .ads-icon-btn--sm.ads-icon-btn--round { background: none; }
.device .ads-icon-btn--sm.ads-icon-btn--round::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--ads-background-surface-sunken); z-index: -1; }
.device .ads-icon-btn--sm.ads-icon-btn--round { isolation: isolate; }
.device .ads-segmented > button { height: var(--ads-size-interactive-md); }
.device .ads-segmented { padding: 2px; }
.device .ads-appheader__account { min-height: var(--ads-size-interactive-md); }
.device .ads-group__foot .ads-link, .device .ads-summary .ads-link { display: inline-block; padding: var(--ads-space-12) 0; margin: -12px 0; }
.ads-calendar > * { flex: none; }
/* iPhone: the app header runs up behind the status bar, so the top of the screen is one surface */
.device--iphone .app { top: 0; }
.device--iphone.device--portrait .ads-appheader { padding-top: calc((50px / var(--text-zoom, 1)) + var(--ads-space-8)); }
.device--iphone.device--landscape .ads-appheader { padding-top: calc((26px / var(--text-zoom, 1)) + var(--ads-space-8)); }
.device--iphone.device--landscape .ads-appheader { margin-inline: calc(-44px / var(--text-zoom, 1)); padding-inline: calc((44px / var(--text-zoom, 1)) + var(--ads-grid-margin)); }

/* =====================================================================
   Version 3 Fare Finder, CLEAR-inspired: navy upper area, rounded light surface,

   ===================================================================== */

.ffc-label { color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; }

.pane--sheet .ads-navbar { background: transparent; border: 0; padding-top: 10px; }

.ffc-sheethead { display: flex; flex-direction: column; gap: 6px; }
.ffc-sheettitle { margin: 0; font-size: 30px; line-height: 1.15; font-weight: var(--ads-font-weight-light); letter-spacing: -0.01em; }
.ffc-sheettitle:focus { outline: none; }
.ffc-sheettitle:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 4px; border-radius: var(--ads-radius-4); }
.ffc-sheetsub { margin: 0; color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); line-height: var(--ads-type-body-small-line-height); }
/* Station search: large pill field, restrained separators, readable rows */
.pane--sheet .ss-search { top: 0; margin: 0 -24px; padding: var(--ads-space-8) var(--ads-space-24) 6px; background: var(--ads-background-surface-default); }
.pane--sheet .ss-search .ads-control { height: 56px; border: 0; background: var(--ads-background-surface-sunken); padding: 0 18px; }
.pane--sheet .ss-search .ads-control:focus-within { box-shadow: inset 0 0 0 2px var(--ads-border-focus); }
.pane--sheet .stsection, .pane--sheet .stlist { margin: 0; }
.pane--sheet .ads-stationrow { background: transparent; border-bottom-color: var(--ads-border-subtle); }
.pane--sheet .ads-stationrow__select { padding-left: 0; }
.pane--sheet .ads-stationrow__code { color: var(--ads-content-text-link); }
.pane--sheet .ads-stationrow__name { font-weight: var(--ads-font-weight-semibold); }

.pane--sheet .ss-allhead { margin: var(--ads-space-12) 0 0; }
.pane--sheet .ads-calendar__weekdays { background: var(--ads-background-surface-default); }

/* Travelers */

.ffc-limit { display: flex; gap: var(--ads-space-8); margin: 10px 0 0; color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); line-height: 1.45; }

.ffc-discs { display: flex; flex-direction: column; }
.ffc-disc { display: flex; flex-direction: column; gap: 6px; padding: var(--ads-space-12) 0; border-bottom: 1px solid var(--ads-border-subtle); }
.ffc-disc__label { font-weight: var(--ads-font-weight-semibold); }
.ffc-fixedval { margin: 0; padding: 10px var(--ads-space-16); border-radius: var(--ads-radius-12); background: var(--ads-background-surface-sunken); font-weight: var(--ads-font-weight-semibold); }
.ffc-fixedcard { display: flex; flex-direction: column; gap: var(--ads-space-4); padding: var(--ads-space-16) var(--ads-space-16); border-radius: var(--ads-radius-16); background: var(--ads-background-surface-sunken); }
.ffc-fixedcard p { margin: 0; }
.pane--sheet section { display: flex; flex-direction: column; gap: var(--ads-space-4); }
/* Discount code */
.ffc-codeentry { display: flex; gap: var(--ads-space-8); }
.ffc-codeentry .ads-control { flex: 1; min-width: 0; }
.ffc-codeentry .ads-btn { flex: none; }
.ffc-codelist { list-style: none; margin: 0; padding: 0; }
.ffc-code { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: var(--ads-space-16) 0; border: 0; border-bottom: 1px solid var(--ads-border-subtle); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ffc-code:hover { background: var(--ads-background-surface-hover); }
.ffc-code__kind { color: var(--ads-content-text-secondary); font-size: var(--ads-type-caption-size); font-weight: var(--ads-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; }
.ffc-code__benefit { color: var(--ads-content-text-link); font-weight: var(--ads-font-weight-semibold); }
.ffc-code__meta { color: var(--ads-content-text-secondary); font-size: var(--ads-type-body-small-size); font-variant-numeric: tabular-nums; }

/* iPad: keep the Fare Finder readable inside its sheet */
.ads-navbar__lead { grid-column: 1; }
.ads-navbar__title { grid-column: 2; }
.ads-navbar__trail { grid-column: 3; }
/* Headings take focus only to move the reading position after a screen change; no ring needed */
.ffc-sheettitle:focus-visible { outline: none; }
/* Larger text: let rows wrap instead of overflowing */
.pane--sheet .ads-segmented > button { white-space: normal; height: auto; min-height: var(--ads-size-interactive-md); padding-block: 6px; line-height: 1.25; }
.ffc-count { flex-wrap: wrap; }
.ffc-count__text { flex: 1 1 140px; }
.ffc-count .ads-counter { margin-left: auto; }
.loyalty__top { flex-wrap: wrap; }
.device .ads-fieldset--inline .ads-fieldset__options { flex-wrap: wrap; }
.device .ads-calendar__grid, .device .ads-calendar__weekdays { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.device .ads-calendar__grid .ads-day::before { width: min(44px, 100%); height: auto; aspect-ratio: 1; }
.edpane .ads-btn--sm { white-space: normal; height: auto; min-height: var(--ads-size-interactive-md); text-align: left; }
.ads-root .ffc-sheettitle[tabindex]:focus-visible { outline: none; box-shadow: none; }
/* Traveler Selection in Versions 1 and 2 reuses the Version 3 traveler editor */
.travsel { display: flex; flex-direction: column; gap: 18px; }
.travsel section { display: flex; flex-direction: column; gap: var(--ads-space-4); }
.ffc-inlinelink { position: relative; display: inline; min-height: 0; padding: 0; border: 0; background: none; font: inherit; color: var(--ads-content-text-link); text-decoration: underline; cursor: pointer; }
.ffc-inlinelink::after { content: ""; position: absolute; inset: -12px 0; }


/* =====================================================================
   Version 4 Fare Finder, Flighty-inspired: white rounded sheet, large heading,
   compact grey controls, aligned rows, restrained color.
   ===================================================================== */
.psheet--fl { background: var(--ads-background-surface-default); border-radius: 28px 28px 0 0; }
.device--ipad .psheet--fl { border-radius: 24px; }
.pane--fl .ads-navbar { background: transparent; border: 0; padding-top: 8px; }
.pane--fl .ads-navbar .ads-icon-btn--round::before, .ver-4 .pane--sheet .ads-navbar .ads-icon-btn--round::before { background: var(--ads-background-surface-sunken) !important; border: 0 !important; }
.pane--fl .pane__body { gap: 22px; padding: 0 var(--ads-space-20) 28px; }
.pane--fl .pane__foot, .ver-4 .pane--sheet .pane__foot { background: var(--ads-background-surface-default); border-top: 0; box-shadow: 0 -1px 0 var(--ads-border-subtle); }
.fl-head { display: flex; flex-direction: column; gap: 8px; margin-top: -6px; }

.ads-root .fl-title[tabindex]:focus-visible, .fl-title:focus { outline: none; }

.fl-ctx { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.fl-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }

.fl-pill__ctl .ads-icon { position: absolute; right: 10px; pointer-events: none; color: var(--ads-content-icon-primary); }

.fl-pill--row { margin-top: 4px; }
.fl-pill--row select { font-size: 15px; }
.fl-note, .fl-notice { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--ads-background-surface-sunken); font-size: 14px; line-height: 1.4; }
.fl-note .ads-icon, .fl-notice > .ads-icon { flex: none; margin-top: 2px; color: var(--ads-content-icon-info); }
.fl-notice > span { flex: 1; }
.fl-notice .ads-icon-btn { margin: -8px -6px -8px 0; }
.fl-search { display: flex; flex-direction: column; gap: 12px; }
.fl-route { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.fl-chip { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; min-height: 64px; padding: 10px 14px; border: 0; border-radius: 16px; background: var(--ads-background-surface-sunken); color: var(--ads-content-text-primary); font: inherit; text-align: left; cursor: pointer; }
.fl-chip:hover { background: var(--ads-background-surface-hover); }
.fl-chip:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 2px; }
.fl-chip.is-error { box-shadow: inset 0 0 0 2px var(--ads-border-status-error); }
.fl-chip__label { color: var(--ads-content-text-secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* One backdrop at a time: when another layer opens above, the layer below hides its own scrim and the top

.fl-chip--date .fl-chip__val { font-size: 15px; letter-spacing: -0.2px; white-space: nowrap; }

.fl-offline { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; }

.cal-nav__title:focus { outline: none; }

.cal-pick > button { height: auto; min-height: var(--ads-size-interactive-md); padding: 6px var(--ads-space-8); white-space: normal; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }

/* ---------- Prototype controller (not part of the app; chrome.js) ---------- */
.stage { flex-direction: column; align-items: center; }
.ctl { position: sticky; top: var(--ads-space-24); display: flex; flex-direction: column; gap: var(--ads-space-16); max-height: calc(100vh - var(--ads-space-48)); overflow-y: auto; overscroll-behavior: contain; padding: var(--ads-space-16); border: 1px solid var(--ads-border-subtle); border-radius: var(--ads-radius-12); background: var(--ads-background-surface-raised); color: var(--ads-content-text-primary); box-shadow: var(--ads-shadow-elevation-md); }
.ctl[hidden] { display: none; }
.ctl__title:focus { outline: none; }
.ctl__title:focus-visible { outline: var(--ads-focus-ring-width) solid var(--ads-border-focus); outline-offset: 2px; border-radius: var(--ads-radius-4); }
.ctl__group { display: flex; flex-direction: column; gap: var(--ads-space-8); }

.ctl .ads-segmented > button:hover:not([aria-pressed="true"]) { color: var(--ads-content-text-primary); }
/* The launcher sits in the right-hand gutter, so it never covers the device or the controller */
.chrome-toggle { position: fixed; z-index: 40; right: max(var(--ads-space-16), env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: var(--ads-size-interactive-md); height: var(--ads-size-interactive-md); padding: 0; border: 1px solid var(--ads-border-subtle); border-radius: var(--ads-radius-full); background: var(--ads-background-surface-raised); color: var(--ads-content-icon-secondary); box-shadow: var(--ads-shadow-elevation-sm); cursor: pointer; transition: color 120ms; }
.chrome-toggle:hover, .chrome-toggle:focus-visible { color: var(--ads-content-icon-primary); }

.chrome-toggle[aria-expanded="true"] { background: var(--ads-background-surface-selected); color: var(--ads-content-icon-primary); }
/* Narrow windows: the launcher sits above the device at the top right, and the controller opens above the
   device in the page flow, pushing it down instead of covering it */
@media (max-width: 700px) {
  .main { padding: calc(var(--ads-space-48) + var(--ads-space-20)) max(var(--ads-space-16), env(safe-area-inset-right)) var(--ads-space-40) max(var(--ads-space-16), env(safe-area-inset-left)); }
  body:not(.chrome-hidden) .main { grid-template-columns: minmax(0, 1fr); }
  .ctl { order: -1; position: static; max-height: none; }
  .chrome-toggle { position: absolute; top: max(var(--ads-space-12), env(safe-area-inset-top)); right: max(var(--ads-space-16), env(safe-area-inset-right)); transform: none; }
}

/* Fare Finder density (Concepts 1 and 3) */

.bk-list { margin: 0; padding: 0; list-style: none; border-radius: var(--ads-radius-16); background: var(--ads-background-surface-default); border: 1px solid var(--ads-border-subtle); overflow: hidden; }

.bk-link { display: flex; align-items: center; gap: var(--ads-space-12); width: 100%; min-height: 64px; padding: var(--ads-space-12) var(--ads-space-16); border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }

@media (max-width: 340px) { .bk-cards { grid-template-columns: 1fr; } }

.bk-headx { position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: var(--ads-space-4) var(--ads-space-16) var(--ads-space-12); background: var(--ads-background-surface-page); transition: box-shadow 160ms; }

   with a hairline on its rounded top edge, so the two read as separate layers. Light mode is unchanged. */

function scaleDevice() {

// Sprint 4 review focus: discovery cards, Book again and Explore are hidden (kept below for later restoration)
const BK_REVIEW_FOCUS = true;
function bookLanding() {
  const d = D(), hist = d.signedIn ? (d.history || []) : [];
  const card = (a, art, title, sub) => `<li class="bk-card"><div class="bk-card__media">${BK_ART[art]}</div><div class="bk-card__body"><h2 class="bk-card__title">${title}</h2><p class="bk-card__sub">${sub}</p><button class="ads-link ads-link--sm linkbtn bk-card__cta" type="button" data-a="${a}" aria-label="Explore ${title.toLowerCase()}">Explore ${ic('chevron-right', 'ads-icon--sm')}</button></div></li>`;
  const near = d.signedIn && d.fav.length ? ['Favorite stations', `Trains from ${ST[d.fav[0]].city} and nearby stations`] : ['Routes near me', 'Trains from stations near you'];
  const rebook = hist.length ? `<section class="bk-sec" aria-labelledby="bk-rebook-h"><h2 class="ads-sr-only" id="bk-rebook-h">Book again</h2><ul class="bk-list bk-rebook">${hist.map((h, i) => `<li class="bk-trip"><div class="bk-trip__text"><span class="bk-trip__route">${esc(ST[h.from].city)} to ${esc(ST[h.to].city)}</span><span class="bk-trip__meta">${h.from} → ${h.to} · ${fmtShort(h.date)} · ${esc(h.train)}</span></div><button class="ads-btn ads-btn--sm bk-trip__btn" type="button" data-a="rebook" data-i="${i}" aria-label="Rebook ${esc(ST[h.from].city)} to ${esc(ST[h.to].city)}">Rebook</button></li>`).join('')}</ul></section>` : '';
  const link = (a, t, sub, icon) => `<li><button class="bk-link" type="button" data-a="${a}">${ic(icon, 'bk-link__icon')}<span class="bk-link__text"><span class="bk-link__title">${t}</span><span class="bk-link__sub">${sub}</span></span>${ic('chevron-right', 'bk-link__chev')}</button></li>`;
  return `<div class="tabpage bk"><h1 class="ads-sr-only">Book</h1>
    <div class="bk-headx"><button class="bk-new" type="button" data-a="open-booking">${ic('search', 'bk-new__icon')}<span class="bk-new__text"><span class="bk-new__title">New booking</span><span class="bk-new__sub">Where to?</span></span></button></div>
    ${BK_REVIEW_FOCUS ? '' : `<ul class="bk-cards" aria-label="Explore trips">${card('bk-recommended', 'trips', 'Recommended trips', 'Scenic routes like the Pacific Surfliner and Adirondack')}${card('bk-near', 'near', near[0], near[1])}</ul>
    ${rebook}`}
    <section class="bk-sec" aria-labelledby="bk-more-h"><h2 class="ads-sr-only" id="bk-more-h">More ways to travel</h2><ul class="bk-list">${BK_REVIEW_FOCUS ? '' : link('bk-explore', 'Explore', 'Destinations, deals and travel ideas', 'map')}${link('bk-passes', 'Passes', 'Rail passes and multi-ride tickets', 'trip-multiple-train')}</ul></section></div>`;
}
// The search bar is pinned to the Book header; content scrolls behind it, and a divider appears under the
// header once content is beneath it
function syncBookHeader() {
  const m = document.querySelector('#device .app-main'), h = document.querySelector('#device .bk-headx');
  if (m && h) h.classList.toggle('is-scrolled', m.scrollTop > 0);
}
document.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('app-main')) syncBookHeader(); }, true);
const bkStub = (t, opener) => openSheet('explore', [R('stub', { t })], opener);
A['bk-recommended'] = () => bkStub('Recommended trips', '[data-a="bk-recommended"]');
A['bk-explore'] = () => bkStub('Explore', '[data-a="bk-explore"]');
A['bk-passes'] = () => bkStub('Passes', '[data-a="bk-passes"]');
// Favorite stations / routes near me: the existing station search, with favorites and recents first
A['bk-near'] = () => { openSheet('booking', ['ff'], '[data-a="bk-near"]'); push('stations', { field: 'from' }, 0); };
// Rebook: a new booking with the past trip's route; dates and travelers start fresh (no trip-history service yet)
A.rebook = t => {
  const i = +t.dataset.i, h = D().history[i], b = D().booking;
  Object.assign(b, { from: h.from, to: h.to, trip: 'ow', dep: TODAY_S, ret: null, notice: null });
  openSheet('booking', ['ff'], `[data-a="rebook"][data-i="${i}"]`);
};

// ---------- Split rules (iPad) ----------
const SPLIT_PARENT = (parent, child) => {
  if (v3()) return parent.s === 'ff' && child.s === 'traveler'; // Overview on iPad: the booking overview stays beside the traveler being edited
  if (v2() && (child.s === 'assist' || child.s === 'assist-profile')) return false;
  const pairs = { ff: ['stations', 'calendar', 'travelers', 'assist', 'code', 'traveler'], travelers: ['assist'], traveler: ['assist'], account: ['profile', 'assist-profile', 'stub'], discounts: ['rules'] }; // Profile edits are third-level screens of their own, never beside the list
  return (pairs[parent.s] || []).includes(child.s);
};
const SPLIT_SELF = r => (v3() && ['profile', 'assist-profile'].includes(r.s)) || (v2() && ['assist', 'assist-profile'].includes(r.s));

// =====================================================================
// A. Fare Finder
// =====================================================================
function ffErrors(b) { return { from: !b.from ? 'Choose a departure station' : '', to: !b.to ? 'Choose an arrival station' : '', ret: b.trip === 'rt' && !b.ret ? 'Choose a return date' : '' }; }
// ---------- New booking fields, normalized against ADS Next and Mobile ADS ----------
// From, To, Depart, Return and Travelers are ADS Text Input fields (field/station, field/large) used as picker
// triggers: the label sits outside the field; the accessible name stays on the button.

/* Sprint 4 prototype: Profile additions shared by all four concepts.
